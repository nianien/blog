<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 645" width="620" height="645" role="img" aria-labelledby="title desc"><title id="title">AKF：三种不同的扩展维度</title><desc id="desc">X 复制实例、Y 拆分业务、Z 划分数据，三者可以组合且各有容量约束</desc><rect width="620" height="645" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">AKF：三种不同的扩展维度</text><rect x="30" y="75" width="560" height="130" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="109" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">X：复制服务实例</text><text x="50" y="144" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">由负载均衡将请求分配给多个副本</text><rect x="30" y="230" width="560" height="130" rx="8" fill="#eef8f1" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="264" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">Y：按业务职责拆分</text><text x="50" y="299" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">例如订单、库存、支付分别承担自己的职责</text><rect x="30" y="385" width="560" height="130" rx="8" fill="#fff7e9" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="419" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">Z：按数据或客户划分</text><text x="50" y="454" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">例如每个分片负责一部分租户或用户</text><text x="30" y="565" font-size="22" fill="#263b4a" font-weight="400" text-anchor="start">三种扩展维度可以组合，但不承诺无限容量</text><text x="30" y="607" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">共享依赖、跨区协调与热点仍决定扩展上限</text></g></svg>
