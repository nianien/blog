<svg xmlns="http://www.w3.org/2000/svg" width="480" height="778" viewBox="0 0 480 778" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
  <title>引擎依赖的四个入口</title>
  <desc>RuleEngine 的求值汇聚到 doEval 后调用 evaluate；编译、线程上下文和 UDF 初始化独立调用引擎</desc>
  <text x="240" y="34" font-size="24" fill="#0F172A" text-anchor="middle" font-weight="600">引擎依赖的四个入口</text>
  <rect x="20" y="62" width="440" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="240" y="101" font-size="22" fill="#065F46" text-anchor="middle" font-weight="600">结构层不直接引用 Rhino 类型</text>
  <text x="240" y="159" font-size="22" fill="#0F172A" text-anchor="middle" font-weight="600">RuleEngine → RhinoEngine</text>
  <rect x="20" y="180" width="440" height="158" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="44" y="210" font-size="21" fill="#1E3A8A" text-anchor="start" font-weight="600">求值</text>
  <text x="240" y="240" font-size="20" fill="#334155" text-anchor="middle">evalRule / evalExpr / evalRuleDesc</text>
  <text x="240" y="275" font-size="20" fill="#334155" text-anchor="middle">doEval(script, root, ctx, args)</text>
  <line x1="240" y1="285" x2="240" y2="297" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="235,297 245,297 240,305" fill="#64748B"/>
  <text x="240" y="328" font-size="22" fill="#1E3A8A" text-anchor="middle" font-weight="600">evaluate</text>
  <rect x="20" y="366" width="440" height="96" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="44" y="396" font-size="21" fill="#334155" text-anchor="start" font-weight="600">脚本编译</text>
  <text x="117" y="437" font-size="20" fill="#334155" text-anchor="middle">doCompile</text>
  <text x="354" y="437" font-size="20" fill="#1E3A8A" text-anchor="middle">compile</text>
  <line x1="192" y1="430" x2="269" y2="430" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="269,425 269,435 277,430" fill="#64748B"/>
  <rect x="20" y="486" width="440" height="96" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="44" y="516" font-size="21" fill="#334155" text-anchor="start" font-weight="600">线程上下文</text>
  <text x="117" y="557" font-size="20" fill="#334155" text-anchor="middle">inContext</text>
  <text x="354" y="557" font-size="20" fill="#1E3A8A" text-anchor="middle">inContext</text>
  <line x1="192" y1="550" x2="269" y2="550" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="269,545 269,555 277,550" fill="#64748B"/>
  <rect x="20" y="606" width="440" height="96" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="44" y="636" font-size="21" fill="#334155" text-anchor="start" font-weight="600">UDF 初始化</text>
  <text x="117" y="677" font-size="20" fill="#334155" text-anchor="middle">构造器</text>
  <text x="354" y="677" font-size="20" fill="#1E3A8A" text-anchor="middle">sharedScope</text>
  <line x1="192" y1="670" x2="269" y2="670" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="269,665 269,675 277,670" fill="#64748B"/>
  <text x="240" y="748" font-size="20" fill="#334155" text-anchor="middle">编排保持独立，计算引擎按需替换</text>
</svg>
