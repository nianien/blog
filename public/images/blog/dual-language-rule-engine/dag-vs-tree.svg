<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
  <rect x="0" y="0" width="900" height="540" fill="#FFFFFF"/>

  <!-- 左：DAG -->
  <rect x="20" y="20" width="410" height="500" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="225" y="50" font-size="16" font-weight="bold" fill="#991B1B" text-anchor="middle">自由连线 DAG</text>
  <text x="225" y="72" font-size="12" fill="#DC2626" text-anchor="middle">汇合点与循环体边界需要额外设计</text>

  <rect x="190" y="95" width="70" height="36" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="225" y="113" font-size="13" fill="#991B1B" text-anchor="middle" dominant-baseline="central">a</text>
  <rect x="70" y="180" width="70" height="36" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="105" y="198" font-size="13" fill="#991B1B" text-anchor="middle" dominant-baseline="central">b</text>
  <rect x="190" y="180" width="70" height="36" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="225" y="198" font-size="13" fill="#991B1B" text-anchor="middle" dominant-baseline="central">c</text>
  <rect x="310" y="180" width="70" height="36" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="345" y="198" font-size="13" fill="#991B1B" text-anchor="middle" dominant-baseline="central">d</text>

  <!-- a -> b,c,d -->
  <line x1="215" y1="131" x2="120" y2="175" stroke="#DC2626" stroke-width="1.5"/>
  <polygon points="112,171 127,174 118,182" fill="#DC2626"/>
  <line x1="225" y1="131" x2="225" y2="175" stroke="#DC2626" stroke-width="1.5"/>
  <polygon points="219,175 231,175 225,182" fill="#DC2626"/>
  <line x1="235" y1="131" x2="330" y2="175" stroke="#DC2626" stroke-width="1.5"/>
  <polygon points="333,171 322,182 318,174" fill="#DC2626"/>

  <!-- 汇合点 -->
  <rect x="165" y="270" width="120" height="46" rx="6" fill="#FCA5A5" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="225" y="289" font-size="12" font-weight="bold" fill="#7F1D1D" text-anchor="middle">汇合点 join</text>
  <text x="225" y="305" font-size="10" fill="#7F1D1D" text-anchor="middle">手工连线 + 引擎识别</text>

  <!-- b,c,d -> join -->
  <line x1="105" y1="216" x2="188" y2="268" stroke="#DC2626" stroke-width="1.5"/>
  <polygon points="191,263 181,274 177,263" fill="#DC2626"/>
  <line x1="225" y1="216" x2="225" y2="268" stroke="#DC2626" stroke-width="1.5"/>
  <polygon points="219,268 231,268 225,275" fill="#DC2626"/>
  <line x1="345" y1="216" x2="262" y2="268" stroke="#DC2626" stroke-width="1.5"/>
  <polygon points="259,263 273,263 263,274" fill="#DC2626"/>

  <!-- join -> e -->
  <rect x="190" y="370" width="70" height="36" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="225" y="388" font-size="13" fill="#991B1B" text-anchor="middle" dominant-baseline="central">e</text>
  <line x1="225" y1="316" x2="225" y2="365" stroke="#DC2626" stroke-width="1.5"/>
  <polygon points="219,365 231,365 225,372" fill="#DC2626"/>

  <!-- 回边 e -> a -->
  <path d="M 260 388 C 380 388 380 113 262 113" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="262,113 274,108 274,118" fill="#B91C1C"/>
  <text x="372" y="252" font-size="11" fill="#B91C1C" text-anchor="middle">回边</text>
  <text x="225" y="448" font-size="12" fill="#991B1B" text-anchor="middle">循环体边界需单独定义语义</text>

  <!-- 右：递归树 -->
  <rect x="470" y="20" width="410" height="500" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="675" y="50" font-size="16" font-weight="bold" fill="#1E3A8A" text-anchor="middle">递归树</text>
  <text x="675" y="72" font-size="12" fill="#2563EB" text-anchor="middle">子树作用域天然消解两类边界</text>

  <!-- SerNode 根 -->
  <rect x="590" y="95" width="170" height="40" rx="6" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="675" y="115" font-size="13" font-weight="bold" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">SerNode 串行</text>

  <!-- 两个子节点 ParNode / LoopNode -->
  <rect x="505" y="190" width="150" height="40" rx="6" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="580" y="210" font-size="13" font-weight="bold" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">ParNode 并行</text>
  <rect x="690" y="190" width="170" height="40" rx="6" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="775" y="210" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">LoopNode 循环</text>

  <line x1="640" y1="135" x2="590" y2="188" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="710" y1="135" x2="760" y2="188" stroke="#2563EB" stroke-width="1.5"/>

  <!-- ParNode 子节点 b c d -->
  <rect x="510" y="285" width="42" height="34" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="531" y="302" font-size="13" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">b</text>
  <rect x="559" y="285" width="42" height="34" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="580" y="302" font-size="13" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c</text>
  <rect x="608" y="285" width="42" height="34" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="629" y="302" font-size="13" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">d</text>
  <line x1="580" y1="230" x2="531" y2="283" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="580" y1="230" x2="580" y2="283" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="580" y1="230" x2="629" y2="283" stroke="#3B82F6" stroke-width="1.5"/>

  <!-- LoopNode 子节点 next 子树 -->
  <rect x="680" y="285" width="180" height="40" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="770" y="305" font-size="12" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">next 子树 = 循环体</text>
  <line x1="775" y1="230" x2="770" y2="283" stroke="#3B82F6" stroke-width="1.5"/>

  <text x="675" y="410" font-size="12" fill="#1E3A8A" text-anchor="middle">并行子树跑完即汇合</text>
  <text x="675" y="432" font-size="12" fill="#1E3A8A" text-anchor="middle">循环体即 next 子树，单根自带边界</text>
</svg>
