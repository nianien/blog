<svg xmlns="http://www.w3.org/2000/svg" width="480" height="940" viewBox="0 0 480 940" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
  <title>流程连线与结构包含</title>
  <desc>两种表示都表达先并行 b 和 c，再在 cond 命中且未达到 N 轮时执行 L，最多 N 轮</desc>
  <text x="240" y="34" font-size="24" fill="#0F172A" text-anchor="middle" font-weight="600">流程连线与结构包含</text>
  <rect x="20" y="60" width="440" height="454" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="240" y="93" font-size="22" fill="#334155" text-anchor="middle" font-weight="600">流程图 · 箭头表示执行方向</text>
  <rect x="206" y="113" width="68" height="40" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="240" y="140" font-size="20" fill="#334155" text-anchor="middle" font-weight="600">开始</text>
  <line x1="240" y1="153" x2="240" y2="168" stroke="#64748B" stroke-width="1.5"/>
  <line x1="120" y1="168" x2="360" y2="168" stroke="#64748B" stroke-width="1.5"/>
  <line x1="120" y1="168" x2="120" y2="176" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="115,176 125,176 120,184" fill="#64748B"/>
  <line x1="360" y1="168" x2="360" y2="176" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="355,176 365,176 360,184" fill="#64748B"/>
  <rect x="88" y="184" width="64" height="42" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="120" y="212" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">b</text>
  <rect x="328" y="184" width="64" height="42" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="360" y="212" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">c</text>
  <line x1="120" y1="226" x2="120" y2="244" stroke="#64748B" stroke-width="1.5"/>
  <line x1="360" y1="226" x2="360" y2="244" stroke="#64748B" stroke-width="1.5"/>
  <line x1="120" y1="244" x2="360" y2="244" stroke="#64748B" stroke-width="1.5"/>
  <line x1="240" y1="244" x2="240" y2="269" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="235,269 245,269 240,277" fill="#64748B"/>
  <text x="353" y="266" font-size="18" fill="#334155" text-anchor="middle">汇合；i=0</text>
  <rect x="90" y="277" width="300" height="50" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="240" y="309" font-size="20" fill="#92400E" text-anchor="middle" font-weight="600">i &lt; N 且 cond 命中</text>
  <line x1="240" y1="327" x2="240" y2="367" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="235,367 245,367 240,375" fill="#64748B"/>
  <text x="260" y="357" font-size="18" fill="#334155" text-anchor="middle">Y</text>
  <rect x="150" y="375" width="180" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="240" y="405" font-size="20" fill="#065F46" text-anchor="middle" font-weight="600">L；i++</text>
  <line x1="330" y1="398" x2="420" y2="398" stroke="#64748B" stroke-width="1.5"/>
  <line x1="420" y1="398" x2="420" y2="302" stroke="#64748B" stroke-width="1.5"/>
  <line x1="420" y1="302" x2="398" y2="302" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="398,297 398,307 390,302" fill="#64748B"/>
  <line x1="90" y1="302" x2="54" y2="302" stroke="#64748B" stroke-width="1.5"/>
  <line x1="54" y1="302" x2="54" y2="472" stroke="#64748B" stroke-width="1.5"/>
  <line x1="54" y1="472" x2="172" y2="472" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="172,467 172,477 180,472" fill="#64748B"/>
  <text x="67" y="350" font-size="18" fill="#334155" text-anchor="middle">N</text>
  <rect x="180" y="449" width="120" height="46" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="240" y="479" font-size="20" fill="#334155" text-anchor="middle" font-weight="600">结束</text>
  <rect x="20" y="548" width="440" height="370" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="240" y="585" font-size="22" fill="#1E3A8A" text-anchor="middle" font-weight="600">内核树 · 连线表示包含关系</text>
  <rect x="140" y="610" width="200" height="48" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="240" y="641" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">SerNode</text>
  <line x1="240" y1="658" x2="240" y2="684" stroke="#64748B" stroke-width="1.5"/>
  <line x1="126" y1="684" x2="354" y2="684" stroke="#64748B" stroke-width="1.5"/>
  <line x1="126" y1="684" x2="126" y2="714" stroke="#64748B" stroke-width="1.5"/>
  <line x1="354" y1="684" x2="354" y2="714" stroke="#64748B" stroke-width="1.5"/>
  <rect x="36" y="714" width="180" height="68" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="126" y="755" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">1  ParNode</text>
  <rect x="264" y="714" width="180" height="68" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="354" y="744" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">2  LoopNode</text>
  <text x="354" y="770" font-size="18" fill="#1E3A8A" text-anchor="middle">max=N · cond</text>
  <line x1="126" y1="782" x2="126" y2="799" stroke="#64748B" stroke-width="1.5"/>
  <line x1="73" y1="799" x2="179" y2="799" stroke="#64748B" stroke-width="1.5"/>
  <line x1="73" y1="799" x2="73" y2="822" stroke="#64748B" stroke-width="1.5"/>
  <line x1="179" y1="799" x2="179" y2="822" stroke="#64748B" stroke-width="1.5"/>
  <rect x="43" y="822" width="60" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="73" y="851" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">b</text>
  <rect x="149" y="822" width="60" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="179" y="851" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">c</text>
  <line x1="354" y1="782" x2="354" y2="822" stroke="#64748B" stroke-width="1.5"/>
  <rect x="284" y="822" width="140" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="354" y="851" font-size="20" fill="#065F46" text-anchor="middle" font-weight="600">action: L</text>
  <text x="240" y="896" font-size="20" fill="#334155" text-anchor="middle">串行子节点按序号执行</text>
</svg>
