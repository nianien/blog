<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#FFFFFF"/>

  <!-- ============ 左：DAG ============ -->
  <rect x="20" y="20" width="410" height="520" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="225" y="50" font-size="16" font-weight="bold" fill="#991B1B" text-anchor="middle">自由连线 DAG</text>
  <text x="225" y="72" font-size="12" fill="#DC2626" text-anchor="middle">同一逻辑：并行 b/c/d 汇合后循环动作 L</text>

  <!-- entry -->
  <rect x="185" y="96" width="80" height="34" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="225" y="113" font-size="13" fill="#991B1B" text-anchor="middle" dominant-baseline="central">开始</text>

  <!-- b c d -->
  <rect x="66" y="184" width="66" height="34" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="99" y="201" font-size="13" fill="#991B1B" text-anchor="middle" dominant-baseline="central">b</text>
  <rect x="192" y="184" width="66" height="34" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="225" y="201" font-size="13" fill="#991B1B" text-anchor="middle" dominant-baseline="central">c</text>
  <rect x="318" y="184" width="66" height="34" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="351" y="201" font-size="13" fill="#991B1B" text-anchor="middle" dominant-baseline="central">d</text>

  <!-- fork edges -->
  <line x1="210" y1="130" x2="112" y2="180" stroke="#DC2626" stroke-width="1.8"/>
  <polygon points="107,182 120,178 117,189" fill="#DC2626"/>
  <line x1="225" y1="130" x2="225" y2="180" stroke="#DC2626" stroke-width="1.8"/>
  <polygon points="219,180 231,180 225,188" fill="#DC2626"/>
  <line x1="240" y1="130" x2="338" y2="180" stroke="#DC2626" stroke-width="1.8"/>
  <polygon points="343,182 330,178 333,189" fill="#DC2626"/>

  <!-- join -->
  <rect x="155" y="272" width="140" height="46" rx="6" fill="#FCA5A5" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="225" y="291" font-size="12" font-weight="bold" fill="#7F1D1D" text-anchor="middle">汇合点 join</text>
  <text x="225" y="307" font-size="10" fill="#7F1D1D" text-anchor="middle">手工连线 + 引擎识别（额外设计①）</text>

  <!-- join edges -->
  <line x1="99" y1="218" x2="184" y2="268" stroke="#DC2626" stroke-width="1.8"/>
  <polygon points="188,271 175,269 181,260" fill="#DC2626"/>
  <line x1="225" y1="218" x2="225" y2="268" stroke="#DC2626" stroke-width="1.8"/>
  <polygon points="219,268 231,268 225,276" fill="#DC2626"/>
  <line x1="351" y1="218" x2="266" y2="268" stroke="#DC2626" stroke-width="1.8"/>
  <polygon points="262,271 275,260 281,269" fill="#DC2626"/>

  <!-- 循环体边界虚线框 -->
  <rect x="150" y="360" width="200" height="112" rx="8" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="250" y="462" font-size="10" fill="#B91C1C" text-anchor="middle">循环体边界（额外设计②）</text>

  <!-- join -> L -->
  <line x1="225" y1="318" x2="225" y2="386" stroke="#DC2626" stroke-width="1.8"/>
  <polygon points="219,386 231,386 225,394" fill="#DC2626"/>

  <!-- L 动作 -->
  <rect x="185" y="396" width="80" height="36" rx="6" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text x="225" y="414" font-size="13" fill="#991B1B" text-anchor="middle" dominant-baseline="central">动作 L</text>

  <!-- 回边：L 自循环 -->
  <path d="M 265 405 C 320 392, 320 430, 268 421" fill="none" stroke="#B91C1C" stroke-width="1.8" stroke-dasharray="5,4"/>
  <polygon points="272,423 259,421 266,412" fill="#B91C1C"/>
  <text x="322" y="415" font-size="11" fill="#B91C1C" text-anchor="middle">命中</text>

  <!-- ============ 右：递归树 ============ -->
  <rect x="470" y="20" width="410" height="520" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="675" y="50" font-size="16" font-weight="bold" fill="#1E3A8A" text-anchor="middle">递归树</text>
  <text x="675" y="72" font-size="12" fill="#2563EB" text-anchor="middle">子树作用域天然消解两类边界</text>

  <!-- Ser 根 -->
  <rect x="590" y="98" width="170" height="40" rx="6" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="675" y="118" font-size="13" font-weight="bold" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">SerNode 串行</text>

  <!-- Par / Loop -->
  <rect x="505" y="196" width="150" height="40" rx="6" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="580" y="216" font-size="13" font-weight="bold" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">ParNode 并行</text>
  <rect x="688" y="188" width="184" height="56" rx="6" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="780" y="208" font-size="13" font-weight="bold" fill="#1E3A8A" text-anchor="middle">LoopNode 循环</text>
  <text x="780" y="227" font-size="11" fill="#1E40AF" text-anchor="middle">cond：命中 · max N</text>

  <!-- Ser edges -->
  <line x1="640" y1="138" x2="590" y2="194" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="712" y1="138" x2="762" y2="186" stroke="#2563EB" stroke-width="1.5"/>

  <!-- Par 子节点 -->
  <rect x="508" y="292" width="42" height="34" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="529" y="309" font-size="13" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">b</text>
  <rect x="559" y="292" width="42" height="34" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="580" y="309" font-size="13" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">c</text>
  <rect x="610" y="292" width="42" height="34" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="631" y="309" font-size="13" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">d</text>
  <line x1="580" y1="236" x2="529" y2="290" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="580" y1="236" x2="580" y2="290" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="580" y1="236" x2="631" y2="290" stroke="#3B82F6" stroke-width="1.5"/>

  <!-- Loop 子节点：循环体 -->
  <rect x="695" y="292" width="170" height="40" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="780" y="312" font-size="12" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">next 子树 = 动作 L</text>
  <line x1="780" y1="244" x2="780" y2="290" stroke="#3B82F6" stroke-width="1.5"/>

  <text x="675" y="410" font-size="12" fill="#1E3A8A" text-anchor="middle">并行子树跑完即汇合，无需汇合点</text>
  <text x="675" y="432" font-size="12" fill="#1E3A8A" text-anchor="middle">循环体即 next 子树，单根自带边界</text>
</svg>
