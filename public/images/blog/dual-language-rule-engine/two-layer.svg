<svg xmlns="http://www.w3.org/2000/svg" width="480" height="564" viewBox="0 0 480 564" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
  <title>两层语言，一组明确的契约</title>
  <desc>结构 DSL 通过规则引用与运行时绑定调用 JavaScript，业务值返回后由内核解释 matched 和 result</desc>
  <text x="240" y="34" font-size="24" fill="#0F172A" text-anchor="middle" font-weight="600">两层语言，一组明确的契约</text>
  <rect x="20" y="62" width="440" height="140" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="240" y="98" font-size="23" fill="#1E3A8A" text-anchor="middle" font-weight="600">结构层 · 规则 ID DSL</text>
  <text x="240" y="137" font-size="23" fill="#1E3A8A" text-anchor="middle">a-&gt;(b=&gt;c)-&gt;d</text>
  <text x="240" y="174" font-size="20" fill="#334155" text-anchor="middle">组合规则，解释命中状态</text>
  <line x1="62" y1="202" x2="62" y2="318" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="57,318 67,318 62,326" fill="#64748B"/>
  <line x1="418" y1="326" x2="418" y2="210" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="413,210 423,210 418,202" fill="#64748B"/>
  <text x="240" y="237" font-size="20" fill="#334155" text-anchor="middle">传入：ruleId · $ · $$ · $args</text>
  <text x="240" y="273" font-size="20" fill="#334155" text-anchor="middle">返回：业务值</text>
  <text x="240" y="305" font-size="20" fill="#334155" text-anchor="middle">内核生成 matched / result</text>
  <rect x="20" y="326" width="440" height="164" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="240" y="366" font-size="23" fill="#065F46" text-anchor="middle" font-weight="600">计算层 · JavaScript</text>
  <text x="240" y="407" font-size="20" fill="#334155" text-anchor="middle">表达式 + Java / JS UDF</text>
  <text x="240" y="449" font-size="22" fill="#065F46" text-anchor="middle">$.age &gt;= $args.min</text>
  <text x="240" y="533" font-size="21" fill="#334155" text-anchor="middle">编排结构与计算实现分别维护</text>
</svg>
