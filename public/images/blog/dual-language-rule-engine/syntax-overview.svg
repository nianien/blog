<svg xmlns="http://www.w3.org/2000/svg" width="480" height="534" viewBox="0 0 480 534" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
  <title>串行与并行</title>
  <desc>串行 a 到 b 到 c；并行示例 a 完成后执行 b 和 c，两者都完成后执行 d</desc>
  <text x="240" y="34" font-size="24" fill="#0F172A" text-anchor="middle" font-weight="600">串行与并行</text>
  <rect x="20" y="62" width="440" height="148" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="240" y="96" font-size="22" fill="#0F172A" text-anchor="middle" font-weight="600">串行  a-&gt;b-&gt;c</text>
  <rect x="50" y="128" width="64" height="46" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="82" y="158" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">a</text>
  <rect x="208" y="128" width="64" height="46" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="240" y="158" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">b</text>
  <rect x="366" y="128" width="64" height="46" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="398" y="158" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">c</text>
  <line x1="114" y1="151" x2="200" y2="151" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="200,146 200,156 208,151" fill="#64748B"/>
  <line x1="272" y1="151" x2="358" y2="151" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="358,146 358,156 366,151" fill="#64748B"/>
  <rect x="20" y="240" width="440" height="270" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="240" y="278" font-size="22" fill="#0F172A" text-anchor="middle" font-weight="600">并行  a-&gt;(b=&gt;c)-&gt;d</text>
  <rect x="40" y="373" width="56" height="46" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="68" y="403" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">a</text>
  <rect x="207" y="324" width="66" height="46" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="240" y="354" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">b</text>
  <rect x="207" y="426" width="66" height="46" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="240" y="456" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">c</text>
  <rect x="384" y="373" width="56" height="46" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="412" y="403" font-size="20" fill="#1E3A8A" text-anchor="middle" font-weight="600">d</text>
  <line x1="96" y1="396" x2="144" y2="396" stroke="#64748B" stroke-width="1.5"/>
  <line x1="144" y1="347" x2="144" y2="449" stroke="#64748B" stroke-width="1.5"/>
  <line x1="144" y1="347" x2="199" y2="347" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="199,342 199,352 207,347" fill="#64748B"/>
  <line x1="144" y1="449" x2="199" y2="449" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="199,444 199,454 207,449" fill="#64748B"/>
  <line x1="273" y1="347" x2="330" y2="347" stroke="#64748B" stroke-width="1.5"/>
  <line x1="273" y1="449" x2="330" y2="449" stroke="#64748B" stroke-width="1.5"/>
  <line x1="330" y1="347" x2="330" y2="449" stroke="#64748B" stroke-width="1.5"/>
  <line x1="330" y1="396" x2="376" y2="396" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="376,391 376,401 384,396" fill="#64748B"/>
  <text x="240" y="493" font-size="19" fill="#334155" text-anchor="middle">b 与 c 都完成后，再执行 d</text>
</svg>
