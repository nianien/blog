<svg xmlns="http://www.w3.org/2000/svg" width="480" height="794" viewBox="0 0 480 794" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
  <title>从编辑模型到执行模型</title>
  <desc>UI JSON 转成 TreeNode，规范化 JSON 留在产品层持久化，内核接收规则定义和 DSL</desc>
  <text x="240" y="34" font-size="24" fill="#0F172A" text-anchor="middle" font-weight="600">从编辑模型到执行模型</text>
  <rect x="30" y="66" width="420" height="72" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="240" y="109" font-size="23" fill="#1E3A8A" text-anchor="middle" font-weight="600">UI TreeNode JSON</text>
  <line x1="150" y1="138" x2="150" y2="186" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="145,186 155,186 150,194" fill="#64748B"/>
  <text x="269" y="173" font-size="18" fill="#334155" text-anchor="middle">反序列化与校验</text>
  <rect x="30" y="194" width="240" height="112" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="150" y="229" font-size="23" fill="#1E3A8A" text-anchor="middle" font-weight="600">TreeNode</text>
  <text x="150" y="261" font-size="20" fill="#334155" text-anchor="middle">深度 ≤ 128</text>
  <text x="150" y="290" font-size="20" fill="#334155" text-anchor="middle">节点 ≤ 2000</text>
  <rect x="316" y="194" width="134" height="112" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="383" y="229" font-size="21" fill="#334155" text-anchor="middle" font-weight="600">产品层</text>
  <text x="383" y="261" font-size="18" fill="#334155" text-anchor="middle">保存规范化</text>
  <text x="383" y="289" font-size="20" fill="#334155" text-anchor="middle">UI JSON</text>
  <line x1="270" y1="250" x2="308" y2="250" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="308,245 308,255 316,250" fill="#64748B"/>
  <line x1="150" y1="306" x2="150" y2="370" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="145,370 155,370 150,378" fill="#64748B"/>
  <text x="274" y="342" font-size="18" fill="#334155" text-anchor="middle">UINodeAdapter</text>
  <text x="274" y="366" font-size="18" fill="#334155" text-anchor="middle">.toRule()</text>
  <rect x="30" y="378" width="240" height="70" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="150" y="420" font-size="23" fill="#065F46" text-anchor="middle" font-weight="600">RuleNode</text>
  <text x="366" y="405" font-size="20" fill="#334155" text-anchor="middle">只保留</text>
  <text x="366" y="433" font-size="20" fill="#334155" text-anchor="middle">执行语义</text>
  <line x1="150" y1="448" x2="150" y2="480" stroke="#64748B" stroke-width="1.5"/>
  <line x1="150" y1="480" x2="240" y2="480" stroke="#64748B" stroke-width="1.5"/>
  <line x1="240" y1="480" x2="240" y2="510" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="235,510 245,510 240,518" fill="#64748B"/>
  <text x="340" y="485" font-size="19" fill="#334155" text-anchor="middle">.expr() → DSL</text>
  <rect x="30" y="518" width="420" height="86" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="240" y="552" font-size="23" fill="#92400E" text-anchor="middle" font-weight="600">RuleDefinition</text>
  <text x="240" y="586" font-size="20" fill="#334155" text-anchor="middle">ruleType=2 · expression=DSL</text>
  <line x1="240" y1="604" x2="240" y2="646" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="235,646 245,646 240,654" fill="#64748B"/>
  <rect x="30" y="654" width="420" height="70" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="240" y="696" font-size="23" fill="#065F46" text-anchor="middle" font-weight="600">RuleSuite 装配与执行</text>
  <text x="240" y="765" font-size="20" fill="#334155" text-anchor="middle">执行树不反向重建 UI AST</text>
</svg>
