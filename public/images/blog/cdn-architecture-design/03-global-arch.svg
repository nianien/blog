<svg xmlns="http://www.w3.org/2000/svg" width="620" height="655" viewBox="0 0 620 655" role="img" aria-label="地域调度与数据处理边界分别验证" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="655" rx="8" fill="#f8fafc"/>
<text x="310" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">地域调度与数据处理边界分别验证</text>
<rect x="55" y="65" width="510" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="310.0" y="99.5" text-anchor="middle" font-size="22" fill="#1e293b">用户请求</text>
<text x="310.0" y="129.5" text-anchor="middle" font-size="22" fill="#1e293b">地域、运营商、终端与业务身份</text>
<path d="M310 150 V181" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,181 310,191 315,181" fill="#475569"/>
<rect x="55" y="191" width="510" height="85" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="310.0" y="225.5" text-anchor="middle" font-size="22" fill="#1e293b">入口调度</text>
<text x="310.0" y="255.5" text-anchor="middle" font-size="22" fill="#1e293b">按实际覆盖、健康与合同选择服务</text>
<path d="M310 276 V307" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,307 310,317 315,307" fill="#475569"/>
<rect x="55" y="317" width="510" height="85" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="310.0" y="351.5" text-anchor="middle" font-size="22" fill="#1e293b">选定 CDN → 允许的源站</text>
<text x="310.0" y="381.5" text-anchor="middle" font-size="22" fill="#1e293b">可单供应商，也可多供应商</text>
<rect x="55" y="447" width="510" height="123" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="310.0" y="485.5" text-anchor="middle" font-size="22" fill="#1e293b">独立核对数据处理链路</text>
<text x="310.0" y="515.5" text-anchor="middle" font-size="22" fill="#1e293b">正文、身份、日志、备份与管理访问</text>
<text x="310.0" y="545.5" text-anchor="middle" font-size="22" fill="#1e293b">处理主体、地点、用途与跨境机制</text>
<text x="310" y="615" text-anchor="middle" font-size="20" fill="#475569">GeoDNS 不能单独形成数据地域边界</text>
</svg>
