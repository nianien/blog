<svg xmlns="http://www.w3.org/2000/svg" width="620" height="838" viewBox="0 0 620 838" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif"><rect width="620" height="838" rx="8" fill="#f8fafc"/><text x="310" y="40" text-anchor="middle" font-size="25" font-weight="600" fill="#253046">转型路径：试点 → 复用 → 编排</text><text x="310" y="77" text-anchor="middle" font-size="20" font-weight="400" fill="#253046">每一步先验收，再决定下一步投入</text><rect x="45" y="105" width="530" height="185" rx="8" fill="#fff7eb" stroke="#a38a66" stroke-width="1.5"/><text x="310.0" y="156.5" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">P0 · 跑通客户协作</text><text x="310.0" y="188.5" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">选择少量交集客户，统一 Tenant ID</text><text x="310.0" y="220.5" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">补齐承接、匹配复核与数据关联</text><text x="310.0" y="252.5" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">验收来源覆盖、错误合并与回流时延</text><path d="M310 290 V326" fill="none" stroke="#687282" stroke-width="1.5"/><polygon points="310,335 305,326 315,326" fill="#687282"/><rect x="45" y="335" width="530" height="185" rx="8" fill="#f5f1ff" stroke="#8a76a5" stroke-width="1.5"/><text x="310.0" y="386.5" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">P1 · 复用稳定能力</text><text x="310.0" y="418.5" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">把重复交付抽成产品与工具</text><text x="310.0" y="450.5" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">共享内容、检索、评测与 CRM 能力</text><text x="310.0" y="482.5" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">验证质量、交付成本和协作收益</text><path d="M310 520 V556" fill="none" stroke="#687282" stroke-width="1.5"/><polygon points="310,565 305,556 315,556" fill="#687282"/><rect x="45" y="565" width="530" height="185" rx="8" fill="#eef4ff" stroke="#657ca7" stroke-width="1.5"/><text x="310.0" y="616.5" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">P2 · 评估全面编排</text><text x="310.0" y="648.5" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">按任务组合工具，逐步引入 Agent</text><text x="310.0" y="680.5" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">按授权范围使用数据与效果知识</text><text x="310.0" y="712.5" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">验证持续交付、毛利、回款与续费</text><text x="310" y="804" text-anchor="middle" font-size="20" font-weight="400" fill="#253046">平台上线只是交付动作，实际收益需要验证</text></svg>
