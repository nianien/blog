<svg xmlns="http://www.w3.org/2000/svg" width="620" height="650" viewBox="0 0 620 650" role="img" aria-label="上传会话决定恢复的位置" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect width="620" height="650" rx="8" fill="#f8fafc"/>
<text x="310" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">上传会话决定恢复的位置</text>
<path d="M310 172 V200" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,200 310,210 315,200" fill="#475569"/>
<path d="M310 322 V350" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,350 310,360 315,350" fill="#475569"/>
<path d="M310 462 V490" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,490 310,500 315,490" fill="#475569"/>
<rect x="65" y="70" width="490" height="102" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="310.0" y="113.0" text-anchor="middle" font-size="22" fill="#1e293b">创建会话：用户、大小、过期时间</text>
<text x="310.0" y="143.0" text-anchor="middle" font-size="22" fill="#1e293b">按协议选择分片大小与并发</text>
<rect x="65" y="210" width="490" height="112" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="310.0" y="258.0" text-anchor="middle" font-size="22" fill="#1e293b">接收字节 / part → 校验并记录</text>
<text x="310.0" y="288.0" text-anchor="middle" font-size="22" fill="#1e293b">重试依据服务端已确认的进度</text>
<rect x="65" y="360" width="490" height="102" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="310.0" y="403.0" text-anchor="middle" font-size="22" fill="#1e293b">确认所有分片完整并按序完成</text>
<text x="310.0" y="433.0" text-anchor="middle" font-size="22" fill="#1e293b">可由对象存储执行 multipart 合并</text>
<rect x="65" y="500" width="490" height="90" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="310.0" y="537.0" text-anchor="middle" font-size="22" fill="#1e293b">整体校验通过 → 发布文件</text>
<text x="310.0" y="567.0" text-anchor="middle" font-size="22" fill="#1e293b">摘要不能替代访问授权</text>
<text x="310" y="628" text-anchor="middle" font-size="20" fill="#475569">图示为通用流程；tus 并发需对应扩展</text>
</svg>
