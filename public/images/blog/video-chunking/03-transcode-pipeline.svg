<svg xmlns="http://www.w3.org/2000/svg" width="620" height="665" viewBox="0 0 620 665" role="img" aria-label="转码任务：时间范围 × 清晰度" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect width="620" height="665" rx="8" fill="#f8fafc"/>
<text x="310" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">转码任务：时间范围 × 清晰度</text>
<path d="M310 154 V183" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,183 310,193 315,183" fill="#475569"/>
<rect x="55" y="65" width="510" height="89" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="310.0" y="101.5" text-anchor="middle" font-size="22" fill="#1e293b">分析源文件与解码起点</text>
<text x="310.0" y="131.5" text-anchor="middle" font-size="22" fill="#1e293b">统一任务配置、帧边界和时间轴</text>
<text x="310" y="218" text-anchor="middle" font-size="20" fill="#475569">示例：两个时间段，各输出两个档位</text>
<rect x="55" y="250" width="235" height="78" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="172.5" y="296.0" text-anchor="middle" font-size="22" fill="#1e293b">720p · 时间段 A</text>
<rect x="55" y="352" width="235" height="78" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="172.5" y="398.0" text-anchor="middle" font-size="22" fill="#1e293b">720p · 时间段 B</text>
<path d="M290 289 H305 V455 H172.5 V474 M290 391 H305" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="167.5,474 172.5,484 177.5,474" fill="#475569"/>
<rect x="55" y="484" width="235" height="82" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="172.5" y="517.0" text-anchor="middle" font-size="22" fill="#1e293b">720p 播放列表</text>
<text x="172.5" y="547.0" text-anchor="middle" font-size="22" fill="#1e293b">按时间 A → B 编排</text>
<rect x="330" y="250" width="235" height="78" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="447.5" y="296.0" text-anchor="middle" font-size="22" fill="#1e293b">360p · 时间段 A</text>
<rect x="330" y="352" width="235" height="78" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="447.5" y="398.0" text-anchor="middle" font-size="22" fill="#1e293b">360p · 时间段 B</text>
<path d="M565 289 H580 V455 H447.5 V474 M565 391 H580" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="442.5,474 447.5,484 452.5,474" fill="#475569"/>
<rect x="330" y="484" width="235" height="82" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="447.5" y="517.0" text-anchor="middle" font-size="22" fill="#1e293b">360p 播放列表</text>
<text x="447.5" y="547.0" text-anchor="middle" font-size="22" fill="#1e293b">按时间 A → B 编排</text>
<text x="310" y="606" text-anchor="middle" font-size="20" fill="#475569">四个编码任务可并行；连线表示汇总</text>
<text x="310" y="638" text-anchor="middle" font-size="20" fill="#475569">各档位分别汇总，切换时间点保持对齐</text>
</svg>
