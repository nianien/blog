<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 640" width="620" height="640" role="img" aria-labelledby="title desc"><title id="title">G1：等大小 Region，按用途管理</title><desc id="desc">G1 将堆划分为等大小 Region，角色包括 Eden、Survivor、Old 与 Humongous</desc><rect width="620" height="640" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">G1：等大小 Region，按用途管理</text><rect x="30" y="90" width="270" height="80" rx="8" fill="#e7f4ec" stroke="#7793a6" stroke-width="1.5"/><text x="165" y="139" font-size="23" fill="#263b4a" font-weight="400" text-anchor="middle">Eden</text><rect x="320" y="90" width="270" height="80" rx="8" fill="#e7f4ec" stroke="#7793a6" stroke-width="1.5"/><text x="455" y="139" font-size="23" fill="#263b4a" font-weight="400" text-anchor="middle">Eden</text><rect x="30" y="190" width="270" height="80" rx="8" fill="#e9f2fb" stroke="#7793a6" stroke-width="1.5"/><text x="165" y="239" font-size="23" fill="#263b4a" font-weight="400" text-anchor="middle">Survivor</text><rect x="320" y="190" width="270" height="80" rx="8" fill="#fff0db" stroke="#7793a6" stroke-width="1.5"/><text x="455" y="239" font-size="23" fill="#263b4a" font-weight="400" text-anchor="middle">Old</text><rect x="30" y="290" width="270" height="80" rx="8" fill="#fff0db" stroke="#7793a6" stroke-width="1.5"/><text x="165" y="339" font-size="23" fill="#263b4a" font-weight="400" text-anchor="middle">Old</text><rect x="320" y="290" width="270" height="80" rx="8" fill="#f5eafb" stroke="#7793a6" stroke-width="1.5"/><text x="455" y="339" font-size="23" fill="#263b4a" font-weight="400" text-anchor="middle">Humongous</text><rect x="30" y="390" width="270" height="80" rx="8" fill="#e7f4ec" stroke="#7793a6" stroke-width="1.5"/><text x="165" y="439" font-size="23" fill="#263b4a" font-weight="400" text-anchor="middle">Eden</text><rect x="320" y="390" width="270" height="80" rx="8" fill="#fff0db" stroke="#7793a6" stroke-width="1.5"/><text x="455" y="439" font-size="23" fill="#263b4a" font-weight="400" text-anchor="middle">Old</text><text x="30" y="526" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">每格表示一个等大小 Region；用途可随运行变化</text><text x="30" y="565" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Humongous 对象可能占用一段连续 Region</text><text x="30" y="604" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">排列仅作示意，不表示每类区域固定相邻</text></g></svg>
