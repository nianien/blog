<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 665" width="620" height="665" role="img" aria-labelledby="title desc"><title id="title">运行时区域与 HotSpot 实现</title><desc id="desc">线程私有区域与共享区域分开；元空间和堆分代属于具体实现</desc><rect width="620" height="665" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">运行时区域与 HotSpot 实现</text><rect x="30" y="75" width="560" height="130" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="109" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">每个线程独有</text><text x="50" y="144" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">程序计数器、Java 虚拟机栈、本地方法栈</text><rect x="30" y="230" width="560" height="140" rx="8" fill="#eef8f1" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="264" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">线程共享：规范中的逻辑区域</text><text x="50" y="299" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">堆：对象与数组</text><text x="50" y="328" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">方法区：类结构、运行时常量池等</text><rect x="30" y="395" width="560" height="140" rx="8" fill="#fff7e9" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="429" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">HotSpot 实现说明</text><text x="50" y="464" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">JDK 8 起，类元数据主要存于本地元空间</text><text x="50" y="493" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">堆布局由收集器决定，不统一画成 Eden / S0 / S1</text><text x="30" y="585" font-size="23" fill="#263b4a" font-weight="600" text-anchor="start">逻辑区域 ≠ 固定物理布局</text><text x="30" y="624" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">直接内存等进程资源不能简单等同于 Java 堆</text></g></svg>
