<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 650" width="620" height="650" role="img" aria-labelledby="title desc"><title id="title">HotSpot 常见对象布局</title><desc id="desc">对象由对象头、实例数据和可选对齐填充组成，尺寸依配置而变</desc><rect width="620" height="650" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">HotSpot 常见对象布局</text><rect x="30" y="75" width="560" height="170" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="109" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">对象头</text><text x="50" y="144" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Mark Word：标记状态等信息</text><text x="50" y="173" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">类型指针：关联类元数据</text><text x="50" y="202" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">数组对象还保存长度</text><rect x="30" y="270" width="560" height="110" rx="8" fill="#eef8f1" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="304" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">实例数据</text><text x="50" y="339" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">本类与父类字段；实际排列由实现决定</text><rect x="30" y="405" width="560" height="110" rx="8" fill="#fff7e9" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="439" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">对齐填充</text><text x="50" y="474" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">用于满足对象对齐，不一定占用额外字节</text><text x="30" y="560" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">以 JDK 8 常见布局说明；默认 8 字节对齐</text><text x="30" y="596" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">指针压缩与对齐参数会改变尺寸，须按配置核对</text></g></svg>
