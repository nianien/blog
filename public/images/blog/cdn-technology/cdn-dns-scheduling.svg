<svg xmlns="http://www.w3.org/2000/svg" width="620" height="700" viewBox="0 0 620 700" role="img" aria-label="先获得入口，再发内容请求" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="700" rx="8" fill="#f8fafc"/>
<text x="310" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">先获得入口，再发内容请求</text>
<path d="M310 145 V175" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,175 310,185 315,175" fill="#475569"/>
<path d="M310 270 V300" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,300 310,310 315,300" fill="#475569"/>
<path d="M310 395 V412 M310 445 V455" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,455 310,465 315,455" fill="#475569"/>
<rect x="70" y="65" width="480" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="310.0" y="112.0" text-anchor="middle" font-size="22" fill="#1e293b">1 · 浏览器查询业务域名</text>
<rect x="50" y="185" width="520" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="310.0" y="219.5" text-anchor="middle" font-size="22" fill="#1e293b">2 · 递归解析器查询权威 DNS</text>
<text x="310.0" y="249.5" text-anchor="middle" font-size="22" fill="#1e293b">未命中 DNS 缓存时继续解析</text>
<rect x="50" y="310" width="520" height="85" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="310.0" y="344.5" text-anchor="middle" font-size="22" fill="#1e293b">3 · 经 CNAME 等得到 CDN 入口</text>
<text x="310.0" y="374.5" text-anchor="middle" font-size="22" fill="#1e293b">依据解析器 / ECS、健康与策略</text>
<text x="310" y="437" text-anchor="middle" font-size="20" fill="#475569">地址经解析器返回浏览器</text>
<rect x="50" y="465" width="520" height="85" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="310.0" y="499.5" text-anchor="middle" font-size="22" fill="#1e293b">4 · 浏览器连接该入口</text>
<text x="310.0" y="529.5" text-anchor="middle" font-size="22" fill="#1e293b">执行 TLS 与 HTTP 内容请求</text>
<text x="310" y="598" text-anchor="middle" font-size="20" fill="#475569">DNS 调度不默认获得精确用户 IP</text>
<text x="310" y="635" text-anchor="middle" font-size="20" fill="#475569">DNS 缓存与长连接影响切换收敛</text>
<text x="310" y="672" text-anchor="middle" font-size="20" fill="#475569">Anycast 是地址路由机制，仍可使用 DNS</text>
</svg>
