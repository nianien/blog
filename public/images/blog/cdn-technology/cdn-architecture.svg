<svg xmlns="http://www.w3.org/2000/svg" width="620" height="670" viewBox="0 0 620 670" role="img" aria-label="请求逐层查找，命中后返回" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="670" rx="8" fill="#f8fafc"/>
<text x="310" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">请求逐层查找，命中后返回</text>
<path d="M310 137 V170" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,170 310,180 315,170" fill="#475569"/>
<path d="M310 267 V300" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,300 310,310 315,300" fill="#475569"/>
<path d="M310 397 V430" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,430 310,440 315,430" fill="#475569"/>
<rect x="70" y="65" width="480" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="310.0" y="108.0" text-anchor="middle" font-size="22" fill="#1e293b">用户请求：同一版本与表示</text>
<rect x="70" y="180" width="480" height="87" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="310.0" y="215.5" text-anchor="middle" font-size="22" fill="#1e293b">边缘缓存</text>
<text x="310.0" y="245.5" text-anchor="middle" font-size="22" fill="#1e293b">命中 → 返回；未命中 → 下一层</text>
<rect x="70" y="310" width="480" height="87" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="310.0" y="345.5" text-anchor="middle" font-size="22" fill="#1e293b">中间层（按需要启用）</text>
<text x="310.0" y="375.5" text-anchor="middle" font-size="22" fill="#1e293b">命中 → 返回；未命中 → 回源</text>
<rect x="70" y="440" width="480" height="87" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="310.0" y="475.5" text-anchor="middle" font-size="22" fill="#1e293b">源站：权威响应</text>
<text x="310.0" y="505.5" text-anchor="middle" font-size="22" fill="#1e293b">动态请求也可能直接经过代理</text>
<text x="310" y="575" text-anchor="middle" font-size="20" fill="#475569">实线向下表示请求，不表示媒体推送</text>
<text x="310" y="610" text-anchor="middle" font-size="20" fill="#475569">响应沿请求路径返回；可缓存时再保存</text>
<text x="310" y="645" text-anchor="middle" font-size="20" fill="#475569">各层缓存策略和共享边界需要分别核对</text>
</svg>
