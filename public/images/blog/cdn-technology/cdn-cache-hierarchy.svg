<svg xmlns="http://www.w3.org/2000/svg" width="620" height="600" viewBox="0 0 620 600" role="img" aria-label="同一可共享对象，合并在途请求" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="600" rx="8" fill="#f8fafc"/>
<text x="310" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">同一可共享对象，合并在途请求</text>
<rect x="35" y="75" width="170" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="120.0" y="117.0" text-anchor="middle" font-size="22" fill="#1e293b">请求 A</text>
<path d="M120 145 V181 H310 V215" fill="none" stroke="#475569" stroke-width="2"/>
<rect x="225" y="75" width="170" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="310.0" y="117.0" text-anchor="middle" font-size="22" fill="#1e293b">请求 B</text>
<path d="M310 145 V181 H310 V215" fill="none" stroke="#475569" stroke-width="2"/>
<rect x="415" y="75" width="170" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="500.0" y="117.0" text-anchor="middle" font-size="22" fill="#1e293b">请求 C</text>
<path d="M500 145 V181 H310 V215" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,215 310,225 315,215" fill="#475569"/>
<rect x="55" y="225" width="510" height="90" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="310.0" y="262.0" text-anchor="middle" font-size="22" fill="#1e293b">同一节点 / 同一共享键</text>
<text x="310.0" y="292.0" text-anchor="middle" font-size="22" fill="#1e293b">一项在途任务，多位等待者</text>
<path d="M310 315 V352" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,352 310,362 315,352" fill="#475569"/>
<rect x="55" y="362" width="510" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="310.0" y="399.0" text-anchor="middle" font-size="22" fill="#1e293b">一次回源（本例无重试）</text>
<text x="310.0" y="429.0" text-anchor="middle" font-size="22" fill="#1e293b">成功或异常都结束等待</text>
<text x="310" y="500" text-anchor="middle" font-size="20" fill="#475569">单个等待者取消，不取消其他人的回源</text>
<text x="310" y="537" text-anchor="middle" font-size="20" fill="#475569">回源任务仍有超时，并限制在途数量</text>
<text x="310" y="574" text-anchor="middle" font-size="20" fill="#475569">不同权限或内容表示，不能强行合并</text>
</svg>
