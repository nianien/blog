<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 815" width="620" height="815" role="img" aria-labelledby="title desc"><title id="title">去重：传递可合并摘要</title><desc id="desc">各节点先形成摘要，再按商品合并，Bitmap 返回精确基数，HLL 返回估计</desc><rect width="620" height="815" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">去重：传递可合并摘要</text><rect x="30" y="75" width="560" height="130" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="109" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">输入：多个节点的访问记录</text><text x="50" y="144" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">同一商品与用户可能在多个节点重复出现</text><path d="M 310 205 V 225" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,235 304,225 316,225" fill="#486777"/><rect x="30" y="235" width="560" height="130" rx="8" fill="#eef8f1" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="269" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">每个节点先形成局部摘要</text><text x="50" y="304" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Bitmap：记录集合；HLL：记录寄存器最大值</text><path d="M 310 365 V 385" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,395 304,385 316,385" fill="#486777"/><rect x="30" y="395" width="560" height="130" rx="8" fill="#eef8f1" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="429" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">按商品键合并摘要</text><text x="50" y="464" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Bitmap 按位 OR；HLL 逐寄存器取最大值</text><path d="M 310 525 V 545" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,555 304,545 316,545" fill="#486777"/><rect x="30" y="555" width="560" height="130" rx="8" fill="#fff7e9" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="589" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">输出：每个商品的 UV</text><text x="50" y="624" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Bitmap 计数为精确值；HLL 为基数估计</text><text x="30" y="735" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">前提：位图映射一致；HLL 哈希、精度与格式兼容</text><text x="30" y="778" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">这是可选执行方案；网络收益取决于摘要与数据规模</text></g></svg>
