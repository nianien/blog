<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 755" width="620" height="755" role="img" aria-labelledby="title desc"><title id="title">HLL：从输入值到基数估计</title><desc id="desc">哈希低位分桶，剩余位计算 rank，寄存器取最大值后聚合为基数估计</desc><rect width="620" height="755" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">HLL：从输入值到基数估计</text><rect x="30" y="80" width="560" height="115" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="114" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">输入值 → 统一编码与 64 位哈希</text><text x="50" y="149" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">相同值必须得到相同的哈希位串</text><path d="M 310 195 V 215" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,225 304,215 316,215" fill="#486777"/><rect x="30" y="225" width="560" height="140" rx="8" fill="#edf9f2" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="259" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">低 p 位选择寄存器</text><text x="50" y="294" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">共有 m = 2^p 个寄存器</text><text x="50" y="323" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">剩余位计算 rank：从低位起首个 1 的位置</text><path d="M 310 365 V 385" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,395 304,385 316,385" fill="#486777"/><rect x="30" y="395" width="560" height="115" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="429" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">更新：M[bucket] = max(M[bucket], rank)</text><text x="50" y="464" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">相同值重复出现不会提高已有的最大值</text><path d="M 310 510 V 530" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,540 304,530 316,530" fill="#486777"/><rect x="30" y="540" width="560" height="140" rx="8" fill="#fff8e8" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="574" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">聚合寄存器，估计基数</text><text x="50" y="609" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">原始估计：α × m² / Σ 2⁻ᴹ⁽ⁱ⁾</text><text x="50" y="638" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">小基数时使用相应修正</text><text x="30" y="725" font-size="22" fill="#263b4a" font-weight="400" text-anchor="start">图中位序对应本文代码；合并须保持相同约定</text></g></svg>
