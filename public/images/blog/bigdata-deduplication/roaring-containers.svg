<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 670" width="620" height="670" role="img" aria-labelledby="title desc"><title id="title">Roaring：分桶与自适应容器</title><desc id="desc">32 位整数用高 16 位定位容器，低 16 位以数组、位图或游程保存</desc><rect width="620" height="670" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">Roaring：分桶与自适应容器</text><rect x="30" y="80" width="560" height="120" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="114" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">输入：一个 32 位整数</text><text x="50" y="149" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">例如 0x00010003：高 16 位为 1，低 16 位为 3</text><path d="M 310 200 V 220" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,230 304,220 316,220" fill="#486777"/><rect x="30" y="230" width="560" height="130" rx="8" fill="#edf9f2" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="264" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">高 16 位定位容器</text><text x="50" y="299" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">同一高位前缀的值进入同一容器</text><text x="50" y="328" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">容器保存低 16 位的信息</text><path d="M 310 360 V 380" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,390 304,380 316,380" fill="#486777"/><rect x="30" y="390" width="560" height="165" rx="8" fill="#fff8e8" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="424" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">低 16 位选择合适的表示</text><text x="50" y="459" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">稀疏：有序数组保存每个值</text><text x="50" y="488" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">稠密：65,536 位的位图</text><text x="50" y="517" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">连续：保存若干游程</text><text x="30" y="600" font-size="22" fill="#263b4a" font-weight="400" text-anchor="start">容器变换与优化时机依实现而异</text><text x="30" y="640" font-size="22" fill="#263b4a" font-weight="400" text-anchor="start">例如数组有 4,096 项时，数据区同为 8 KiB</text></g></svg>
