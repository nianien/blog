<svg xmlns="http://www.w3.org/2000/svg" width="620" height="740" viewBox="0 0 620 740" role="img" aria-label="审核结果决定状态，复查可以重评" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
