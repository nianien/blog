<svg xmlns="http://www.w3.org/2000/svg" width="620" height="700" viewBox="0 0 620 700" role="img" aria-label="逐步筛选候选，按需增加阶段" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="700" rx="8" fill="#f8fafc"/>
<text x="310" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">逐步筛选候选，按需增加阶段</text>
<path d="M310 150 V180" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,180 310,190 315,180" fill="#475569"/>
<path d="M310 275 V305" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,305 310,315 315,305" fill="#475569"/>
<path d="M310 400 V430" fill="none" stroke="#475569" stroke-width="2"/>
<polygon points="305,430 310,440 315,430" fill="#475569"/>
<rect x="60" y="65" width="500" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="310.0" y="99.5" text-anchor="middle" font-size="22" fill="#1e293b">多路召回</text>
<text x="310.0" y="129.5" text-anchor="middle" font-size="22" fill="#1e293b">合并去重，保留全部来源</text>
<rect x="60" y="190" width="500" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="310.0" y="224.5" text-anchor="middle" font-size="22" fill="#1e293b">粗排（按成本与效果选择）</text>
<text x="310.0" y="254.5" text-anchor="middle" font-size="22" fill="#1e293b">低成本模型筛选候选</text>
<rect x="60" y="315" width="500" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="310.0" y="349.5" text-anchor="middle" font-size="22" fill="#1e293b">精排</text>
<text x="310.0" y="379.5" text-anchor="middle" font-size="22" fill="#1e293b">使用约定特征预测多种反馈</text>
<rect x="60" y="440" width="500" height="85" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="310.0" y="474.5" text-anchor="middle" font-size="22" fill="#1e293b">列表重排</text>
<text x="310.0" y="504.5" text-anchor="middle" font-size="22" fill="#1e293b">多样性、探索、频控与广告</text>
<text x="310" y="575" text-anchor="middle" font-size="20" fill="#475569">权限、内容状态与用户选择贯穿链路</text>
<text x="310" y="613" text-anchor="middle" font-size="20" fill="#475569">返回前再校验，缓存与降级不能绕过</text>
<text x="310" y="651" text-anchor="middle" font-size="20" fill="#475569">候选数与延迟预算需由实际负载验证</text>
</svg>
