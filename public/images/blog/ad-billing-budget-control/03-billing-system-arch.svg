<svg xmlns="http://www.w3.org/2000/svg" width="620" height="850" viewBox="0 0 620 850" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="850" rx="8" fill="#f8fafc"/>
<text x="310" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">额度授权与计费事实分别维护</text>
<path d="M270 155V202" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="270,210 265,201 275,201" fill="#475569"/>
<path d="M270 305V357" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="270,365 265,356 275,356" fill="#475569"/>
<path d="M270 465V517" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="270,525 265,516 275,516" fill="#475569"/>
<path d="M270 620V672" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="270,680 265,671 275,671" fill="#475569"/>
<rect x="45" y="70" width="450" height="85" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="270.0" y="105.5" text-anchor="middle" font-size="22" fill="#172033">预算授权：已用 + 预留 ≤ 上限</text>
<text x="270.0" y="135.5" text-anchor="middle" font-size="22" fill="#172033">按账户、币种与周期检查</text>
<rect x="45" y="210" width="450" height="95" rx="8" fill="#f5f3ff" stroke="#8060ba" stroke-width="1.5"/>
<text x="270.0" y="250.5" text-anchor="middle" font-size="22" fill="#172033">持久化预留，再参与交付</text>
<text x="270.0" y="280.5" text-anchor="middle" font-size="22" fill="#172033">失败释放需确认责任已终止</text>
<rect x="45" y="365" width="450" height="100" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="270.0" y="408.0" text-anchor="middle" font-size="22" fill="#172033">接收合格计费事件</text>
<text x="270.0" y="438.0" text-anchor="middle" font-size="22" fill="#172033">验来源、规则、金额与幂等键</text>
<rect x="45" y="525" width="450" height="95" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="270.0" y="565.5" text-anchor="middle" font-size="22" fill="#172033">一次事务提交</text>
<text x="270.0" y="595.5" text-anchor="middle" font-size="22" fill="#172033">流水、额度状态与待发通知</text>
<rect x="45" y="680" width="450" height="85" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="270.0" y="715.5" text-anchor="middle" font-size="22" fill="#172033">对账、调整与结算</text>
<text x="270.0" y="745.5" text-anchor="middle" font-size="22" fill="#172033">保留原记录与差异原因</text>
<path d="M495 255H517" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="525,255 516,250 516,260" fill="#475569"/>
<rect x="525" y="190" width="75" height="145" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="562.5" y="240.5" text-anchor="middle" font-size="22" fill="#172033">未知</text>
<text x="562.5" y="270.5" text-anchor="middle" font-size="22" fill="#172033">保留</text>
<text x="562.5" y="300.5" text-anchor="middle" font-size="22" fill="#172033">核对</text>
<text x="270" y="805" text-anchor="middle" font-size="20" fill="#475569">胜出通知不自动成为计费事件</text>
<text x="270" y="833" text-anchor="middle" font-size="19" fill="#475569">重复事件返回原结果，迟到事件按规则归属</text>
</svg>
