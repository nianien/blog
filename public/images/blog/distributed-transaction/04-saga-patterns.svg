<svg xmlns="http://www.w3.org/2000/svg" width="620" height="940" viewBox="0 0 620 940" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="940" rx="8" fill="#f8fafc"/>
<text x="310" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">Saga：两种组织方式，共同恢复责任</text>
<rect x="40" y="70" width="540" height="295" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310" y="108" text-anchor="middle" font-size="24" fill="#475569">事件协作 · 服务根据事件推进</text>
<path d="M310 195V222" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,230 305,221 315,221" fill="#475569"/>
<rect x="75" y="135" width="470" height="60" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="173.0" text-anchor="middle" font-size="22" fill="#172033">订单本地事务 + 待发送事件</text>
<rect x="75" y="230" width="470" height="90" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="310.0" y="268.0" text-anchor="middle" font-size="22" fill="#172033">库存消费事件并提交本地事务</text>
<text x="310.0" y="298.0" text-anchor="middle" font-size="22" fill="#172033">继续发布后续事件</text>
<text x="310" y="349" text-anchor="middle" font-size="20" fill="#475569">追踪关联事件，避免重复处理与事件循环</text>
<rect x="40" y="405" width="540" height="295" rx="8" fill="#f5f3ff" stroke="#8060ba" stroke-width="1.5"/>
<text x="310" y="443" text-anchor="middle" font-size="24" fill="#475569">中心编排 · 编排器调度各步骤</text>
<path d="M310 530V557" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,565 305,556 315,556" fill="#475569"/>
<rect x="75" y="470" width="470" height="60" rx="8" fill="#f5f3ff" stroke="#8060ba" stroke-width="1.5"/>
<text x="310.0" y="508.0" text-anchor="middle" font-size="22" fill="#172033">编排器先持久化步骤意图与幂等键</text>
<rect x="75" y="565" width="470" height="90" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="310.0" y="603.0" text-anchor="middle" font-size="22" fill="#172033">发出执行或补偿命令</text>
<text x="310.0" y="633.0" text-anchor="middle" font-size="22" fill="#172033">查询结果，记录状态后继续</text>
<text x="310" y="684" text-anchor="middle" font-size="20" fill="#475569">恢复调度使用同一业务标识</text>
<rect x="40" y="750" width="540" height="115" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="310.0" y="785.5" text-anchor="middle" font-size="22" fill="#172033">共同要求：未知结果先确认</text>
<text x="310.0" y="815.5" text-anchor="middle" font-size="22" fill="#172033">按依赖补偿已完成步骤；失败进入待处理</text>
<text x="310.0" y="845.5" text-anchor="middle" font-size="22" fill="#172033">补偿是业务动作，不保证物理恢复原状</text>
<text x="310" y="911" text-anchor="middle" font-size="20" fill="#475569">Saga 不提供跨全部步骤的数据库隔离</text>
</svg>
