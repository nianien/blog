<svg xmlns="http://www.w3.org/2000/svg" width="620" height="650" viewBox="0 0 620 650" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="650" rx="8" fill="#f8fafc"/>
<text x="310" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">3PC：成功路径中的三个阶段</text>
<path d="M310 170V217" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,225 305,216 315,216" fill="#475569"/>
<path d="M310 330V377" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,385 305,376 315,376" fill="#475569"/>
<rect x="55" y="70" width="510" height="100" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="113.0" text-anchor="middle" font-size="22" fill="#172033">1 · CanCommit：征询投票</text>
<text x="310.0" y="143.0" text-anchor="middle" font-size="22" fill="#172033">确认能否履行承诺，回复 Yes / No</text>
<rect x="55" y="225" width="510" height="105" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="310.0" y="270.5" text-anchor="middle" font-size="22" fill="#172033">2 · PreCommit：预提交</text>
<text x="310.0" y="300.5" text-anchor="middle" font-size="22" fill="#172033">收齐 Yes 后推进，记录并确认状态</text>
<rect x="55" y="385" width="510" height="105" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="310.0" y="430.5" text-anchor="middle" font-size="22" fill="#172033">3 · DoCommit：完成提交</text>
<text x="310.0" y="460.5" text-anchor="middle" font-size="22" fill="#172033">按决定完成并确认，释放相关资源</text>
<text x="310" y="540" text-anchor="middle" font-size="22" fill="#475569">故障恢复还需要状态与终止协议</text>
<text x="310" y="578" text-anchor="middle" font-size="22" fill="#475569">非阻塞结论依赖同步与故障假设</text>
<text x="310" y="613" text-anchor="middle" font-size="20" fill="#475569">任意分区下不能只凭超时自行提交</text>
</svg>
