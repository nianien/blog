<svg xmlns="http://www.w3.org/2000/svg" width="620" height="955" viewBox="0 0 620 955" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="955" rx="8" fill="#f8fafc"/>
<text x="310" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">Outbox：提交意图，再可靠投递</text>
<path d="M270 160V197" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="270,205 265,196 275,196" fill="#475569"/>
<path d="M270 305V342" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="270,350 265,341 275,341" fill="#475569"/>
<path d="M270 445V482" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="270,490 265,481 275,481" fill="#475569"/>
<path d="M270 590V627" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="270,635 265,626 275,626" fill="#475569"/>
<rect x="45" y="65" width="450" height="95" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="270.0" y="105.5" text-anchor="middle" font-size="22" fill="#172033">上游同一本地事务</text>
<text x="270.0" y="135.5" text-anchor="middle" font-size="22" fill="#172033">业务变更 + Outbox(event_id)</text>
<rect x="45" y="205" width="450" height="100" rx="8" fill="#f5f3ff" stroke="#8060ba" stroke-width="1.5"/>
<text x="270.0" y="248.0" text-anchor="middle" font-size="22" fill="#172033">投递器发送稳定 event_id</text>
<text x="270.0" y="278.0" text-anchor="middle" font-size="22" fill="#172033">Broker 确认后记录 SENT</text>
<rect x="45" y="350" width="450" height="95" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="270.0" y="390.5" text-anchor="middle" font-size="22" fill="#172033">Broker 投递，可能重复</text>
<text x="270.0" y="420.5" text-anchor="middle" font-size="22" fill="#172033">ACK 不是下游业务完成</text>
<rect x="45" y="490" width="450" height="100" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="270.0" y="533.0" text-anchor="middle" font-size="22" fill="#172033">下游同一本地事务</text>
<text x="270.0" y="563.0" text-anchor="middle" font-size="22" fill="#172033">唯一 Inbox + 业务更新一起提交</text>
<rect x="45" y="635" width="450" height="110" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="270.0" y="668.0" text-anchor="middle" font-size="22" fill="#172033">提交后确认消费</text>
<text x="270.0" y="698.0" text-anchor="middle" font-size="22" fill="#172033">需要跟踪完成时，可靠发送业务回执</text>
<text x="270.0" y="728.0" text-anchor="middle" font-size="22" fill="#172033">回执也需重试和去重</text>
<path d="M270 745V782" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="270,790 265,781 275,781" fill="#475569"/>
<rect x="45" y="790" width="450" height="95" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="270.0" y="830.5" text-anchor="middle" font-size="22" fill="#172033">上游接收业务回执后记录 DONE</text>
<text x="270.0" y="860.5" text-anchor="middle" font-size="22" fill="#172033">发送与记录之间崩溃，仍可能重发</text>
<text x="310" y="928" text-anchor="middle" font-size="20" fill="#475569">外部付款等副作用不在下游本地事务内</text>
</svg>
