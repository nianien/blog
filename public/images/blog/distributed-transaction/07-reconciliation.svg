<svg xmlns="http://www.w3.org/2000/svg" width="620" height="930" viewBox="0 0 620 930" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="930" rx="8" fill="#f8fafc"/>
<text x="310" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">对账：先确认差异，再执行修复</text>
<path d="M165 155V190H455V155" fill="none" stroke="#475569" stroke-width="1.5"/>
<path d="M310 190V217" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,225 305,216 315,216" fill="#475569"/>
<path d="M310 325V362" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,370 305,361 315,361" fill="#475569"/>
<path d="M310 470V505H165V542M310 505H455V542" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="165,550 160,541 170,541" fill="#475569"/>
<polygon points="455,550 450,541 460,541" fill="#475569"/>
<rect x="35" y="70" width="260" height="85" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="165.0" y="105.5" text-anchor="middle" font-size="22" fill="#172033">订单与支付记录</text>
<text x="165.0" y="135.5" text-anchor="middle" font-size="22" fill="#172033">支付尝试、退款</text>
<rect x="325" y="70" width="260" height="85" rx="8" fill="#f5f3ff" stroke="#8060ba" stroke-width="1.5"/>
<text x="455.0" y="105.5" text-anchor="middle" font-size="22" fill="#172033">渠道账单与查询</text>
<text x="455.0" y="135.5" text-anchor="middle" font-size="22" fill="#172033">结算与手续费</text>
<rect x="55" y="225" width="510" height="100" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="268.0" text-anchor="middle" font-size="22" fill="#172033">对齐业务键、币种、日期和金额口径</text>
<text x="310.0" y="298.0" text-anchor="middle" font-size="22" fill="#172033">保留原始记录与来源，允许一对多</text>
<rect x="55" y="370" width="510" height="100" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="310.0" y="413.0" text-anchor="middle" font-size="22" fill="#172033">比较并调查差异</text>
<text x="310.0" y="443.0" text-anchor="middle" font-size="22" fill="#172033">缺失、延迟、口径不同或真实错账</text>
<text x="165" y="497" text-anchor="middle" font-size="20" fill="#475569">证据充分</text>
<text x="455" y="497" text-anchor="middle" font-size="20" fill="#475569">查询超时或证据不足</text>
<rect x="35" y="550" width="260" height="130" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="165.0" y="593.0" text-anchor="middle" font-size="22" fill="#172033">确认差异</text>
<text x="165.0" y="623.0" text-anchor="middle" font-size="22" fill="#172033">按状态机条件更新</text>
<text x="165.0" y="653.0" text-anchor="middle" font-size="22" fill="#172033">幂等补录或补偿</text>
<rect x="325" y="550" width="260" height="130" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="455.0" y="593.0" text-anchor="middle" font-size="22" fill="#172033">保留待确认</text>
<text x="455.0" y="623.0" text-anchor="middle" font-size="22" fill="#172033">持续查询与复核</text>
<text x="455.0" y="653.0" text-anchor="middle" font-size="22" fill="#172033">不能默认关单</text>
<path d="M165 680V710H455V680 M310 710V737" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,745 305,736 315,736" fill="#475569"/>
<rect x="55" y="745" width="510" height="100" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="773.0" text-anchor="middle" font-size="22" fill="#172033">保存处理状态与执行回执</text>
<text x="310.0" y="803.0" text-anchor="middle" font-size="22" fill="#172033">失败继续追踪，核对最终业务状态</text>
<text x="310.0" y="833.0" text-anchor="middle" font-size="22" fill="#172033">人工处置同样保留来源与审计</text>
<text x="310" y="890" text-anchor="middle" font-size="20" fill="#475569">发现差异不等于修复已经完成</text>
</svg>
