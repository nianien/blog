<svg xmlns="http://www.w3.org/2000/svg" width="620" height="910" viewBox="0 0 620 910" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="910" rx="8" fill="#f8fafc"/>
<text x="310" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">事务消息：回查依赖持久业务结果</text>
<path d="M310 160V197" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,205 305,196 315,196" fill="#475569"/>
<path d="M310 305V342" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,350 305,341 315,341" fill="#475569"/>
<path d="M310 450V480H165V527M310 480H455V527" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="165,535 160,526 170,526" fill="#475569"/>
<polygon points="455,535 450,526 460,526" fill="#475569"/>
<rect x="55" y="65" width="510" height="95" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="105.5" text-anchor="middle" font-size="22" fill="#172033">Producer 发送半消息</text>
<text x="310.0" y="135.5" text-anchor="middle" font-size="22" fill="#172033">Broker 保存，消费者暂不可见</text>
<rect x="55" y="205" width="510" height="100" rx="8" fill="#f5f3ff" stroke="#8060ba" stroke-width="1.5"/>
<text x="310.0" y="248.0" text-anchor="middle" font-size="22" fill="#172033">Producer 执行本地事务</text>
<text x="310.0" y="278.0" text-anchor="middle" font-size="22" fill="#172033">使用稳定业务键记录可查询结果</text>
<rect x="55" y="350" width="510" height="100" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="393.0" text-anchor="middle" font-size="22" fill="#172033">报告 Commit / Rollback / Unknown</text>
<text x="310.0" y="423.0" text-anchor="middle" font-size="22" fill="#172033">响应丢失时也可能没有确定结果</text>
<text x="165" y="475" text-anchor="middle" font-size="20" fill="#475569">结果确定</text>
<text x="455" y="475" text-anchor="middle" font-size="20" fill="#475569">结果未知或无响应</text>
<rect x="35" y="535" width="260" height="140" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="165.0" y="583.0" text-anchor="middle" font-size="22" fill="#172033">Commit：消息可见</text>
<text x="165.0" y="613.0" text-anchor="middle" font-size="22" fill="#172033">Rollback：消息丢弃</text>
<text x="165.0" y="643.0" text-anchor="middle" font-size="22" fill="#172033">消费仍需要幂等</text>
<rect x="325" y="535" width="260" height="140" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="455.0" y="583.0" text-anchor="middle" font-size="22" fill="#172033">Broker 发起回查</text>
<text x="455.0" y="613.0" text-anchor="middle" font-size="22" fill="#172033">实例查询持久结果</text>
<text x="455.0" y="643.0" text-anchor="middle" font-size="22" fill="#172033">按协议再次报告</text>
<rect x="55" y="725" width="510" height="100" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="310.0" y="753.0" text-anchor="middle" font-size="22" fill="#172033">未知状态按版本配置继续处理</text>
<text x="310.0" y="783.0" text-anchor="middle" font-size="22" fill="#172033">回查次数、超时与最终处置必须明确</text>
<text x="310.0" y="813.0" text-anchor="middle" font-size="22" fill="#172033">不能把记录暂不存在直接等同于失败</text>
<text x="310" y="870" text-anchor="middle" font-size="20" fill="#475569">消息提交不等于下游业务已经完成</text>
</svg>
