<svg xmlns="http://www.w3.org/2000/svg" width="620" height="860" viewBox="0 0 620 860" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="860" rx="8" fill="#f8fafc"/>
<text x="310" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">TCC：预留后确认或释放</text>
<path d="M310 160V197" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,205 305,196 315,196" fill="#475569"/>
<path d="M310 315V355H165V407M310 355H455V407" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="165,415 160,406 170,406" fill="#475569"/>
<polygon points="455,415 450,406 460,406" fill="#475569"/>
<rect x="55" y="70" width="510" height="90" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="108.0" text-anchor="middle" font-size="22" fill="#172033">事务管理器调度 Try</text>
<text x="310.0" y="138.0" text-anchor="middle" font-size="22" fill="#172033">库存、余额等分支各自提交本地预留</text>
<rect x="55" y="205" width="510" height="110" rx="8" fill="#f5f3ff" stroke="#8060ba" stroke-width="1.5"/>
<text x="310.0" y="238.0" text-anchor="middle" font-size="22" fill="#172033">分支状态：TRIED</text>
<text x="310.0" y="268.0" text-anchor="middle" font-size="22" fill="#172033">库存示例：可用 −10，冻结 +10</text>
<text x="310.0" y="298.0" text-anchor="middle" font-size="22" fill="#172033">持久化本分支数量与事务标识</text>
<text x="165" y="345" text-anchor="middle" font-size="20" fill="#475569">全部成功，决定确认</text>
<text x="455" y="345" text-anchor="middle" font-size="20" fill="#475569">失败，决定取消</text>
<rect x="35" y="415" width="260" height="145" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="165.0" y="465.5" text-anchor="middle" font-size="22" fill="#172033">Confirm</text>
<text x="165.0" y="495.5" text-anchor="middle" font-size="22" fill="#172033">TRIED → CONFIRMED</text>
<text x="165.0" y="525.5" text-anchor="middle" font-size="22" fill="#172033">冻结 −10，完成扣减</text>
<rect x="325" y="415" width="260" height="145" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="455.0" y="465.5" text-anchor="middle" font-size="22" fill="#172033">Cancel</text>
<text x="455.0" y="495.5" text-anchor="middle" font-size="22" fill="#172033">TRIED → CANCELED</text>
<text x="455.0" y="525.5" text-anchor="middle" font-size="22" fill="#172033">冻结 −10，可用 +10</text>
<rect x="55" y="625" width="510" height="125" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="665.5" text-anchor="middle" font-size="22" fill="#172033">共同依赖持久分支状态机</text>
<text x="310.0" y="695.5" text-anchor="middle" font-size="22" fill="#172033">重复调用幂等；取消墓碑拒绝迟到 Try</text>
<text x="310.0" y="725.5" text-anchor="middle" font-size="22" fill="#172033">结果未知时查询或按同一标识重试</text>
<text x="310" y="795" text-anchor="middle" font-size="22" fill="#475569">Confirm 与 Cancel 不能同时生效</text>
<text x="310" y="830" text-anchor="middle" font-size="20" fill="#475569">不是把每个本地事务长期保持为未提交</text>
</svg>
