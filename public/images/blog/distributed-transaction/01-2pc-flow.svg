<svg xmlns="http://www.w3.org/2000/svg" width="620" height="900" viewBox="0 0 620 900" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="900" rx="8" fill="#f8fafc"/>
<text x="310" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">2PC：投票后形成统一决定</text>
<path d="M310 160V197" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,205 305,196 315,196" fill="#475569"/>
<path d="M310 305V342" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,350 305,341 315,341" fill="#475569"/>
