<polygon points="165,525 160,516 170,516" fill="#475569"/>
<polygon points="455,525 450,516 460,516" fill="#475569"/>
<path d="M165 665V705H455V665" fill="none" stroke="#475569" stroke-width="1.5"/>
<path d="M310 705V737" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,745 305,736 315,736" fill="#475569"/>
<rect x="60" y="65" width="500" height="95" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="105.5" text-anchor="middle" font-size="22" fill="#172033">协调者发起 Prepare</text>
<text x="310.0" y="135.5" text-anchor="middle" font-size="22" fill="#172033">分支操作可能已经执行</text>
<rect x="60" y="205" width="500" height="100" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="248.0" text-anchor="middle" font-size="22" fill="#172033">参与者持久化准备状态</text>
<text x="310.0" y="278.0" text-anchor="middle" font-size="22" fill="#172033">能够履行承诺后投 Yes，否则投 No</text>
<rect x="60" y="350" width="500" height="100" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="310.0" y="393.0" text-anchor="middle" font-size="22" fill="#172033">协调者汇总所需投票</text>
<text x="310.0" y="423.0" text-anchor="middle" font-size="22" fill="#172033">形成并可靠记录 Commit / Abort</text>
<text x="165" y="477" text-anchor="middle" font-size="20" fill="#475569">收齐所需 Yes</text>
<text x="455" y="477" text-anchor="middle" font-size="20" fill="#475569">未满足提交条件</text>
<rect x="35" y="525" width="260" height="140" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="165.0" y="573.0" text-anchor="middle" font-size="22" fill="#172033">Commit</text>
<text x="165.0" y="603.0" text-anchor="middle" font-size="22" fill="#172033">通知全部分支提交</text>
<text x="165.0" y="633.0" text-anchor="middle" font-size="22" fill="#172033">参与者确认结果</text>
<rect x="325" y="525" width="260" height="140" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="455.0" y="573.0" text-anchor="middle" font-size="22" fill="#172033">Abort</text>
<text x="455.0" y="603.0" text-anchor="middle" font-size="22" fill="#172033">通知分支回滚</text>
<text x="455.0" y="633.0" text-anchor="middle" font-size="22" fill="#172033">参与者确认结果</text>
<rect x="60" y="745" width="500" height="85" rx="8" fill="#f5f3ff" stroke="#8060ba" stroke-width="1.5"/>
<text x="310.0" y="780.5" text-anchor="middle" font-size="22" fill="#172033">决定持久化后可重发与恢复</text>
<text x="310.0" y="810.5" text-anchor="middle" font-size="22" fill="#172033">通信恢复不改变已经形成的决定</text>
<text x="310" y="866" text-anchor="middle" font-size="20" fill="#475569">prepared 分支不能仅因本地超时自行回滚</text>
