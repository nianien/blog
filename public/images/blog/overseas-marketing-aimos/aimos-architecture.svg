<svg xmlns="http://www.w3.org/2000/svg" width="620" height="878" viewBox="0 0 620 878" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif"><rect width="620" height="878" rx="8" fill="#f8fafc"/><text x="310" y="40" text-anchor="middle" font-size="25" font-weight="600" fill="#253046">AIMOS：可组合能力与共同治理</text><text x="310" y="77" text-anchor="middle" font-size="20" font-weight="400" fill="#253046">目标架构；外部入口按真实需求逐步开放</text><rect x="45" y="105" width="530" height="168" rx="8" fill="#eef4ff" stroke="#657ca7" stroke-width="1.5"/><text x="310.0" y="148.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">交互层 · 任务入口</text><text x="310.0" y="180.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">自有 Agent / 专用界面</text><text x="310.0" y="212.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">客户脚本或 Agent → API / MCP</text><text x="310.0" y="244.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">展示计划、审批与执行结果</text><rect x="45" y="303" width="530" height="136" rx="8" fill="#f0faf5" stroke="#638976" stroke-width="1.5"/><text x="310.0" y="346.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">工具层 · 明确操作契约</text><text x="310.0" y="378.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">建站、内容、分发、查询与 CRM</text><text x="310.0" y="410.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">区分生成建议、保存草稿与实际发布</text><rect x="45" y="469" width="530" height="136" rx="8" fill="#fff7eb" stroke="#a38a66" stroke-width="1.5"/><text x="310.0" y="512.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">知识与记忆 · 提供调用依据</text><text x="310.0" y="544.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">企业资料、行业知识与效果记录</text><text x="310.0" y="576.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">保留来源、版本与适用范围</text><rect x="45" y="635" width="530" height="168" rx="8" fill="#f5f1ff" stroke="#8a76a5" stroke-width="1.5"/><text x="310.0" y="678.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">评测与治理 · 贯穿上面各层</text><text x="310.0" y="710.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">租户隔离、权限、审批与审计</text><text x="310.0" y="742.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">离线评测、在线实验与版本追踪</text><text x="310.0" y="774.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">同一治理规则覆盖自有和外部入口</text><text x="310" y="846" text-anchor="middle" font-size="20" font-weight="400" fill="#253046">四层表示职责划分，不是依次执行的流水线</text></svg>
