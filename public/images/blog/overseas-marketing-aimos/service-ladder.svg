<svg xmlns="http://www.w3.org/2000/svg" width="620" height="875" viewBox="0 0 620 875" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif"><rect width="620" height="875" rx="8" fill="#f8fafc"/><text x="310" y="40" text-anchor="middle" font-size="25" font-weight="600" fill="#253046">服务阶梯：从客户已有条件出发</text><text x="310" y="77" text-anchor="middle" font-size="20" font-weight="400" fill="#253046">按需组合服务，客户不必走完全程</text><rect x="55" y="105" width="510" height="104" rx="8" fill="#eef4ff" stroke="#657ca7" stroke-width="1.5"/><text x="310.0" y="148.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">① 建站</text><text x="310.0" y="180.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">没有站点时，建立内容与承接载体</text><path d="M310 209 V238" fill="none" stroke="#687282" stroke-width="1.5"/><polygon points="310,247 305,238 315,238" fill="#687282"/><rect x="55" y="247" width="510" height="104" rx="8" fill="#f0faf5" stroke="#638976" stroke-width="1.5"/><text x="310.0" y="290.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">② 内容运营</text><text x="310.0" y="322.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">已有站点可从这里或后续环节接入</text><path d="M310 351 V380" fill="none" stroke="#687282" stroke-width="1.5"/><polygon points="310,389 305,380 315,380" fill="#687282"/><rect x="55" y="389" width="510" height="104" rx="8" fill="#fff7eb" stroke="#a38a66" stroke-width="1.5"/><text x="310.0" y="432.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">③ 营销传播</text><text x="310.0" y="464.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">按目标市场选择渠道并分发内容</text><path d="M310 493 V522" fill="none" stroke="#687282" stroke-width="1.5"/><polygon points="310,531 305,522 315,522" fill="#687282"/><rect x="55" y="531" width="510" height="104" rx="8" fill="#f5f1ff" stroke="#8a76a5" stroke-width="1.5"/><text x="310.0" y="574.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">④ 承接转化</text><text x="310.0" y="606.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">用落地页、表单与咨询承接需求</text><path d="M310 635 V664" fill="none" stroke="#687282" stroke-width="1.5"/><polygon points="310,673 305,664 315,664" fill="#687282"/><rect x="55" y="673" width="510" height="104" rx="8" fill="#eef4ff" stroke="#657ca7" stroke-width="1.5"/><text x="310.0" y="716.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">⑤ CRM 经营</text><text x="310.0" y="748.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">跟进商机、成交与复购</text><text x="310" y="844" text-anchor="middle" font-size="20" font-weight="400" fill="#253046">连线表示服务范围延伸，不是强制购买顺序</text></svg>
