<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1020" viewBox="0 0 620 1020" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif"><rect width="620" height="1020" rx="8" fill="#f8fafc"/><text x="310" y="40" text-anchor="middle" font-size="25" font-weight="600" fill="#253046">反馈闭环：关联数据，检验改进</text><text x="310" y="77" text-anchor="middle" font-size="20" font-weight="400" fill="#253046">同一租户内关联内容版本、渠道与买家标识</text><rect x="100" y="108" width="460" height="98" rx="8" fill="#eef4ff" stroke="#657ca7" stroke-width="1.5"/><text x="330.0" y="148.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">① 知识依据</text><text x="330.0" y="180.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">带来源、版本与适用范围的企业资料</text><path d="M330 206 V239" fill="none" stroke="#687282" stroke-width="1.5"/><polygon points="330,248 325,239 335,239" fill="#687282"/><rect x="100" y="248" width="460" height="98" rx="8" fill="#f0faf5" stroke="#638976" stroke-width="1.5"/><text x="330.0" y="288.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">② 内容生成</text><text x="330.0" y="320.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">依据资料生成草稿，审核后发布</text><path d="M330 346 V379" fill="none" stroke="#687282" stroke-width="1.5"/><polygon points="330,388 325,379 335,379" fill="#687282"/><rect x="100" y="388" width="460" height="98" rx="8" fill="#fff7eb" stroke="#a38a66" stroke-width="1.5"/><text x="330.0" y="428.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">③ 渠道分发</text><text x="330.0" y="460.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">记录内容版本、渠道和活动标识</text><path d="M330 486 V519" fill="none" stroke="#687282" stroke-width="1.5"/><polygon points="330,528 325,519 335,519" fill="#687282"/><rect x="100" y="528" width="460" height="98" rx="8" fill="#f5f1ff" stroke="#8a76a5" stroke-width="1.5"/><text x="330.0" y="568.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">④ 承接与 CRM</text><text x="330.0" y="600.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">记录咨询、商机与跟进结果</text><path d="M330 626 V659" fill="none" stroke="#687282" stroke-width="1.5"/><polygon points="330,668 325,659 335,659" fill="#687282"/><rect x="100" y="668" width="460" height="98" rx="8" fill="#eef4ff" stroke="#657ca7" stroke-width="1.5"/><text x="330.0" y="708.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">⑤ 结果回收</text><text x="330.0" y="740.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">核对来源、订单与交付结果</text><path d="M330 766 V799" fill="none" stroke="#687282" stroke-width="1.5"/><polygon points="330,808 325,799 335,799" fill="#687282"/><rect x="100" y="808" width="460" height="98" rx="8" fill="#f0faf5" stroke="#638976" stroke-width="1.5"/><text x="330.0" y="848.0" text-anchor="middle" font-size="22" font-weight="600" fill="#253046">⑥ 评测与改进</text><text x="330.0" y="880.0" text-anchor="middle" font-size="22" font-weight="400" fill="#253046">筛选反馈，验证后更新知识或模板</text><path d="M100 857 H52 V157 H91" fill="none" stroke="#687282" stroke-width="1.5"/><polygon points="100,157 91,152 91,162" fill="#687282"/><text x="310" y="954" text-anchor="middle" font-size="20" font-weight="400" fill="#253046">左侧回路：仅回写经过筛选与验证的反馈</text><text x="310" y="989" text-anchor="middle" font-size="20" font-weight="400" fill="#253046">来源关联用于追踪；增量效果另行检验</text></svg>
