<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1040" viewBox="0 0 620 1040" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="1040" rx="8" fill="#f8fafc"/>
<text x="310" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">配音流水线：7 个阶段与 2 个关卡</text>
<rect x="65" y="80" width="490" height="70" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="108.0" text-anchor="middle" font-size="22" fill="#172033">1  Extract</text>
<text x="310.0" y="138.0" text-anchor="middle" font-size="22" fill="#172033">提取音频与分离伴奏</text>
<path d="M310 150V172" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,180 305,171 315,171" fill="#475569"/>
<rect x="65" y="180" width="490" height="70" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="208.0" text-anchor="middle" font-size="22" fill="#172033">2  ASR</text>
<text x="310.0" y="238.0" text-anchor="middle" font-size="22" fill="#172033">保留原始识别响应</text>
<path d="M310 250V272" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,280 305,271 315,271" fill="#475569"/>
<rect x="65" y="280" width="490" height="70" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="308.0" text-anchor="middle" font-size="22" fill="#172033">3  Parse</text>
<text x="310.0" y="338.0" text-anchor="middle" font-size="22" fill="#172033">断句并写入数据库字幕</text>
<path d="M310 350V372" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,380 305,371 315,371" fill="#475569"/>
<rect x="65" y="380" width="490" height="60" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="310.0" y="418.0" text-anchor="middle" font-size="22" fill="#172033">校准关卡 · source_review</text>
<path d="M310 440V462" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,470 305,461 315,461" fill="#475569"/>
<rect x="65" y="470" width="490" height="70" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="310.0" y="498.0" text-anchor="middle" font-size="22" fill="#172033">4  Translate</text>
<text x="310.0" y="528.0" text-anchor="middle" font-size="22" fill="#172033">译文回填与时间策略</text>
<path d="M310 540V562" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,570 305,561 315,561" fill="#475569"/>
<rect x="65" y="570" width="490" height="60" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="310.0" y="608.0" text-anchor="middle" font-size="22" fill="#172033">审阅关卡 · translation_review</text>
<path d="M310 630V652" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,660 305,651 315,651" fill="#475569"/>
<rect x="65" y="660" width="490" height="70" rx="8" fill="#f5f3ff" stroke="#8060ba" stroke-width="1.5"/>
<text x="310.0" y="688.0" text-anchor="middle" font-size="22" fill="#172033">5  TTS</text>
<text x="310.0" y="718.0" text-anchor="middle" font-size="22" fill="#172033">逐段合成与结果记录</text>
<path d="M310 730V752" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,760 305,751 315,751" fill="#475569"/>
<rect x="65" y="760" width="490" height="70" rx="8" fill="#f5f3ff" stroke="#8060ba" stroke-width="1.5"/>
<text x="310.0" y="788.0" text-anchor="middle" font-size="22" fill="#172033">6  Mix</text>
<text x="310.0" y="818.0" text-anchor="middle" font-size="22" fill="#172033">放回时间轴，与伴奏混音</text>
<path d="M310 830V852" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,860 305,851 315,851" fill="#475569"/>
<rect x="65" y="860" width="490" height="70" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="888.0" text-anchor="middle" font-size="22" fill="#172033">7  Burn</text>
<text x="310.0" y="918.0" text-anchor="middle" font-size="22" fill="#172033">烧录字幕并输出成片</text>
<text x="310" y="980" text-anchor="middle" font-size="20" fill="#475569">橙色关卡等待人工确认，再继续下游</text>
<text x="310" y="1013" text-anchor="middle" font-size="19" fill="#475569">字幕与角色以数据库为准，媒体产物保留为文件</text>
</svg>
