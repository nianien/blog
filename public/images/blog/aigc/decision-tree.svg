<svg xmlns="http://www.w3.org/2000/svg" width="620" height="680" viewBox="0 0 620 680" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="680" rx="8" fill="#f8fafc"/>
<text x="310" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">完整三叉树：叶节点不等于全部片段</text>
<rect x="185" y="70" width="250" height="65" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="110.5" text-anchor="middle" font-size="22" fill="#172033">第 0 层：1 个根节点</text>
<path d="M310 135V165H110V191M310 165V191M310 165H510V191" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="110,200 105,190 115,190" fill="#475569"/>
<polygon points="310,200 305,190 315,190" fill="#475569"/>
<polygon points="510,200 505,190 515,190" fill="#475569"/>
<rect x="30" y="200" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="110.0" y="238.0" text-anchor="middle" font-size="22" fill="#172033">分支 A</text>
<rect x="230" y="200" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="310.0" y="238.0" text-anchor="middle" font-size="22" fill="#172033">分支 B</text>
<rect x="430" y="200" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="510.0" y="238.0" text-anchor="middle" font-size="22" fill="#172033">分支 C</text>
<text x="310" y="306" text-anchor="middle" font-size="20" fill="#475569">第 1 层：3 个节点</text>
<rect x="65" y="340" width="490" height="90" rx="8" fill="#f5f3ff" stroke="#8060ba" stroke-width="1.5"/>
<text x="310.0" y="378.0" text-anchor="middle" font-size="22" fill="#172033">继续分支至第 5 层</text>
<text x="310.0" y="408.0" text-anchor="middle" font-size="22" fill="#172033">每个节点都展开 3 个新节点</text>
<path d="M310 430V457" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,465 305,456 315,456" fill="#475569"/>
<rect x="65" y="465" width="490" height="90" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="310.0" y="503.0" text-anchor="middle" font-size="22" fill="#172033">第 5 层：3⁵ = 243 个叶节点</text>
<text x="310.0" y="533.0" text-anchor="middle" font-size="22" fill="#172033">全部：1 + 3 + 9 + 27 + 81 + 243 = 364</text>
<text x="310" y="607" text-anchor="middle" font-size="19" fill="#475569">假设每个节点对应一个独立片段，且无合流与复用</text>
<text x="310" y="643" text-anchor="middle" font-size="18" fill="#475569">真实模块化设计可以复用素材，数量不必按完整树增长</text>
</svg>
