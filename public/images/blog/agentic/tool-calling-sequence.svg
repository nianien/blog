<svg xmlns="http://www.w3.org/2000/svg" width="620" height="730" viewBox="0 0 620 730" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
<rect x="0" y="0" width="620" height="730" rx="8" fill="#f8fafc"/>
<text x="310" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">订单调查：一次工具调用如何闭环</text>
<path d="M105 125V670" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M310 125V670" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M515 125V670" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="30" y="65" width="150" height="60" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="105.0" y="103.0" text-anchor="middle" font-size="22" fill="#172033">模型</text>
<rect x="230" y="65" width="160" height="60" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="310.0" y="103.0" text-anchor="middle" font-size="22" fill="#172033">运行时</text>
<rect x="435" y="65" width="160" height="60" rx="8" fill="#eff6ff" stroke="#5276bf" stroke-width="1.5"/>
<text x="515.0" y="103.0" text-anchor="middle" font-size="22" fill="#172033">订单工具</text>
<text x="207" y="164" text-anchor="middle" font-size="20" fill="#475569">1. 任务与上下文</text>
<path d="M310 180H113" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="105,180 114,175 114,185" fill="#475569"/>
<text x="207" y="214" text-anchor="middle" font-size="20" fill="#475569">2. 查询请求</text>
<path d="M105 230H302" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,230 301,225 301,235" fill="#475569"/>
<rect x="215" y="260" width="190" height="85" rx="8" fill="#fff7ed" stroke="#a56b49" stroke-width="1.5"/>
<text x="310.0" y="295.5" text-anchor="middle" font-size="22" fill="#172033">记录调用</text>
<text x="310.0" y="325.5" text-anchor="middle" font-size="22" fill="#172033">校验权限与参数</text>
<text x="420" y="383" text-anchor="middle" font-size="20" fill="#475569">3. 获准执行</text>
<path d="M310 400H507" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="515,400 506,395 506,405" fill="#475569"/>
<text x="420" y="443" text-anchor="middle" font-size="20" fill="#475569">4. 实际结果</text>
<path d="M515 460H318" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,460 319,455 319,465" fill="#475569"/>
<rect x="215" y="485" width="190" height="70" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
<text x="310.0" y="513.0" text-anchor="middle" font-size="22" fill="#172033">按调用 ID</text>
<text x="310.0" y="543.0" text-anchor="middle" font-size="22" fill="#172033">记录结果</text>
<text x="200" y="592" text-anchor="middle" font-size="20" fill="#475569">5. 调用与结果</text>
<path d="M310 610H113" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="105,610 114,605 114,615" fill="#475569"/>
<text x="200" y="649" text-anchor="middle" font-size="20" fill="#475569">6. 回答或新动作</text>
<path d="M105 665H302" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="310,665 301,660 301,670" fill="#475569"/>
<text x="310" y="708" text-anchor="middle" font-size="20" fill="#475569">运行时核验交付，或继续受约束的循环</text>
</svg>
