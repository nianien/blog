<text x="215.0" y="263.0" text-anchor="middle" font-size="22" fill="#172033">权限、业务条件与审批</text>
<rect x="45" y="350" width="340" height="85" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
