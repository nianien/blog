<text x="520.0" y="540.5" text-anchor="middle" font-size="22" fill="#172033">暂停</text>
<text x="520.0" y="570.5" text-anchor="middle" font-size="22" fill="#172033">或停止</text>
<path d="M215 580V635H20V108H36" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="45,108 35,103 35,113" fill="#475569"/>
<text x="215" y="322" text-anchor="middle" font-size="20" fill="#475569">检查通过</text>
<text x="310" y="671" text-anchor="middle" font-size="20" fill="#475569">需要调整且允许继续时，返回候选动作</text>
<text x="310" y="712" text-anchor="middle" font-size="20" fill="#475569">预算、时限与取消贯穿执行，不等于成功条件</text>
