<text x="520.0" y="248.0" text-anchor="middle" font-size="22" fill="#172033">等待</text>
<text x="520.0" y="278.0" text-anchor="middle" font-size="22" fill="#172033">或拒绝</text>
<path d="M385 530H442" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="450,530 441,525 441,535" fill="#475569"/>
<rect x="450" y="485" width="140" height="95" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
