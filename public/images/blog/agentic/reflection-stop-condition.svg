<text x="215.0" y="415.5" text-anchor="middle" font-size="22" fill="#172033">保存操作标识与结果</text>
<rect x="45" y="485" width="340" height="95" rx="8" fill="#f5f3ff" stroke="#8060ba" stroke-width="1.5"/>
<text x="215.0" y="525.5" text-anchor="middle" font-size="22" fill="#172033">执行后核验</text>
<text x="215.0" y="555.5" text-anchor="middle" font-size="22" fill="#172033">验收条件、未知项与进展</text>
<path d="M385 240H442" fill="none" stroke="#475569" stroke-width="1.5"/>
<polygon points="450,240 441,235 441,245" fill="#475569"/>
