<text x="235.0" y="145.5" text-anchor="middle" font-size="22" fill="#172033">根据当前反馈更新上下文</text>
<rect x="40" y="260" width="390" height="130" rx="8" fill="#f0fdf4" stroke="#548878" stroke-width="1.5"/>
