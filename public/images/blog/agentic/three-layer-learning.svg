<text x="235.0" y="533.0" text-anchor="middle" font-size="22" fill="#172033">T3 跨版本策略改进</text>
<text x="235.0" y="563.0" text-anchor="middle" font-size="22" fill="#172033">候选生成、独立评测与发布</text>
<text x="235.0" y="593.0" text-anchor="middle" font-size="22" fill="#172033">固定生效范围并持续观察</text>
<text x="235" y="214" text-anchor="middle" font-size="20" fill="#475569">提炼候选，核验后入库</text>
