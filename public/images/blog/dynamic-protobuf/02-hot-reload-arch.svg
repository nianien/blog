<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 955" width="620" height="955" role="img" aria-labelledby="title desc"><title id="title">A versioned schema update path</title><desc id="desc">Offline export and runtime validation precede atomic publication; in-flight requests retain their registry version</desc><rect width="620" height="955" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">A versioned schema update path</text><rect x="30" y="75" width="560" height="115" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="109" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">Offline: compile and export</text><text x="50" y="144" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">protoc + plugin → versioned descriptors</text><path d="M 310 190 V 215" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,225 304,215 316,215" fill="#486777"/><rect x="30" y="225" width="560" height="115" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="259" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">Distribute a candidate version</text><text x="50" y="294" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Configuration center or schema registry</text><path d="M 310 340 V 365" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,375 304,365 316,365" fill="#486777"/><rect x="30" y="375" width="560" height="115" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="409" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">Runtime: validate before publication</text><text x="50" y="444" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Check imports and compatibility; build a registry</text><path d="M 310 490 V 515" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,525 304,515 316,515" fill="#486777"/><rect x="30" y="525" width="560" height="115" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="559" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">Publish one immutable version</text><text x="50" y="594" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">New requests use the new registry</text><path d="M 310 640 V 665" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,675 304,665 316,665" fill="#486777"/><rect x="30" y="675" width="560" height="115" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="709" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">Keep each request on one version</text><text x="50" y="744" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">In-flight work retains its original descriptors</text><text x="30" y="845" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Invalid update → retain the last working registry</text><text x="30" y="885" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Architecture plan; watcher and atomic publication</text><text x="30" y="917" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">are not implemented by the example loader</text></g></svg>
