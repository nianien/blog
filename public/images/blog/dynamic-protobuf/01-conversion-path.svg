<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 790" width="620" height="790" role="img" aria-labelledby="title desc"><title id="title">From schema to a dynamic message</title><desc id="desc">Compile the schema offline, resolve descriptors, select a message type and create a dynamic message</desc><rect width="620" height="790" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">From schema to a dynamic message</text><rect x="30" y="75" width="560" height="110" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="109" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">.proto source</text><text x="50" y="144" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Compile offline with protoc</text><path d="M 310 185 V 205" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,215 304,205 316,205" fill="#486777"/><rect x="30" y="215" width="560" height="110" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="249" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">FileDescriptorProto</text><text x="50" y="284" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Serialize descriptor data with protojson</text><path d="M 310 325 V 345" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,355 304,345 316,345" fill="#486777"/><rect x="30" y="355" width="560" height="110" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="389" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">FileDescriptor</text><text x="50" y="424" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Resolve imports and validate the graph</text><path d="M 310 465 V 485" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,495 304,485 316,485" fill="#486777"/><rect x="30" y="495" width="560" height="110" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="529" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">MessageDescriptor</text><text x="50" y="564" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Select the required message type</text><path d="M 310 605 V 625" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,635 304,625 316,625" fill="#486777"/><rect x="30" y="635" width="560" height="110" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="669" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">dynamicpb.Message</text><text x="50" y="704" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">Read fields; marshal and unmarshal data</text></g></svg>
