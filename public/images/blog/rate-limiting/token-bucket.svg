<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 710" width="620" height="710" role="img" aria-labelledby="title desc"><title id="title">令牌桶：速率与突发容量分开控制</title><desc id="desc">令牌以固定速率补充至容量上限，请求原子检查并扣减，余额不足时拒绝或有界等待</desc><rect width="620" height="710" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">令牌桶：速率与突发容量分开控制</text><rect x="30" y="75" width="560" height="130" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="109" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">按速率补充令牌</text><text x="50" y="144" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">余额最多增加到桶容量；满桶后不继续累积</text><path d="M 310 205 V 225" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,235 304,225 316,225" fill="#486777"/><rect x="30" y="235" width="560" height="110" rx="8" fill="#eef8f1" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="269" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">请求到达：检查可用令牌</text><text x="50" y="304" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">检查与扣减须原子执行</text><path d="M 310 345 V 370" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,380 304,370 316,370" fill="#486777"/><path d="M 310 360 H 15 V 575 H 22" fill="none" stroke="#486777" stroke-width="2"/><polygon points="30,575 20,569 20,581" fill="#486777"/><rect x="30" y="380" width="560" height="110" rx="8" fill="#eef8f1" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="414" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">有令牌：扣减后放行</text><text x="50" y="449" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">瞬时突发由桶容量限制</text><rect x="30" y="520" width="560" height="110" rx="8" fill="#fff7e9" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="554" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">无令牌：按策略拒绝或等待</text><text x="50" y="589" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">等待须有超时；不能无上限积压</text><text x="30" y="670" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">下方两框是互斥结果，不是先后执行步骤</text></g></svg>
