<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 795" width="620" height="795" role="img" aria-labelledby="title desc"><title id="title">流量治理：按请求路径分层保护</title><desc id="desc">请求依次经过接入、网关、业务与依赖访问保护，各层职责不同</desc><rect width="620" height="795" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">流量治理：按请求路径分层保护</text><rect x="30" y="75" width="560" height="125" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="109" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">接入层：连接与请求速率</text><text x="50" y="144" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">按 IP 等维度过滤；需配合专门的攻击防护</text><path d="M 310 200 V 225" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,235 304,225 316,225" fill="#486777"/><rect x="30" y="235" width="560" height="125" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="269" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">网关层：用户 / 租户 / API 配额</text><text x="50" y="304" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">按身份与接口执行差异化速率限制</text><path d="M 310 360 V 385" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,395 304,385 316,385" fill="#486777"/><rect x="30" y="395" width="560" height="125" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="429" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">业务层：业务动作频率</text><text x="50" y="464" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">约束发帖、下单、短信等业务操作</text><path d="M 310 520 V 545" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,555 304,545 316,545" fill="#486777"/><rect x="30" y="555" width="560" height="125" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="589" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">依赖访问层：容量与故障保护</text><text x="50" y="624" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">连接池、并发隔离、熔断共同保护下游</text><text x="30" y="755" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">各层解决不同问题；连接池和熔断不等同于限流</text></g></svg>
