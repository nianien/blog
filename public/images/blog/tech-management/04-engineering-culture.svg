<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 685" width="620" height="685" role="img" aria-labelledby="title desc"><title id="title">把工程文化落实到日常行为</title><desc id="desc">透明、端到端负责、质量与协作分别落实为可观察的团队行为</desc><rect width="620" height="685" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">把工程文化落实到日常行为</text><rect x="30" y="80" width="560" height="130" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="114" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">透明</text><text x="50" y="149" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">共享决策过程与理由</text><text x="50" y="178" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">用决策记录和复盘留下可追溯信息</text><rect x="30" y="230" width="560" height="130" rx="8" fill="#edf9f2" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="264" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">Ownership：端到端负责</text><text x="50" y="299" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">明确责任、权限与交接</text><text x="50" y="328" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">发现职责空缺时主动协调补位</text><rect x="30" y="380" width="560" height="130" rx="8" fill="#fff8e8" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="414" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">质量</text><text x="50" y="449" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">建立评审、测试与上线标准</text><text x="50" y="478" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">对不满足标准的变更做明确取舍</text><rect x="30" y="530" width="560" height="130" rx="8" fill="#f2effc" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="564" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">协作</text><text x="50" y="599" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">跨团队配合与技术共建</text><text x="50" y="628" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">让知识和接口约定能够持续共享</text></g></svg>
