<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 710" width="620" height="710" role="img" aria-labelledby="title desc"><title id="title">组织操作系统：三层职责</title><desc id="desc">目标绩效沟通、人才培养文化制度、项目与棘手问题分为三层，规模变化影响各层</desc><rect width="620" height="710" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">组织操作系统：三层职责</text><rect x="30" y="80" width="560" height="135" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="114" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">运行逻辑层</text><text x="50" y="149" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">目标 · 绩效 · 沟通</text><text x="50" y="178" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">对齐方向，建立反馈与信息流</text><rect x="30" y="235" width="560" height="135" rx="8" fill="#edf9f2" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="269" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">基础设施层</text><text x="50" y="304" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">人才 · 培养 · 文化 · 制度</text><text x="50" y="333" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">建设团队持续运转的条件</text><rect x="30" y="390" width="560" height="135" rx="8" fill="#fff8e8" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="424" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">执行保障层</text><text x="50" y="459" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">项目管理 · 棘手问题</text><text x="50" y="488" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">推进交付，处理日常与异常</text><rect x="30" y="550" width="560" height="135" rx="8" fill="#f2effc" stroke="#7793a6" stroke-width="1.5"/><text x="50" y="584" font-size="24" fill="#263b4a" font-weight="600" text-anchor="start">跨层关注：规模跃迁</text><text x="50" y="619" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">随职责与协作范围调整九个模块</text><text x="50" y="648" font-size="21" fill="#263b4a" font-weight="400" text-anchor="start">三层表示职责分类，并非执行先后</text></g></svg>
