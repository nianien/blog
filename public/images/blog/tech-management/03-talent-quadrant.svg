<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 685" width="620" height="685" role="img" aria-labelledby="title desc"><title id="title">能力与意愿：选择支持方式</title><desc id="desc">以当前任务的能力和意愿区分培养、授权、诊断支持与恢复投入，状态可以变化</desc><rect width="620" height="685" fill="#fff"/><g font-family="system-ui, -apple-system, &apos;PingFang SC&apos;, sans-serif"><text x="30" y="42" font-size="27" fill="#263b4a" font-weight="600" text-anchor="start">能力与意愿：选择支持方式</text><rect x="65" y="110" width="220" height="185" rx="8" fill="#edf9f2" stroke="#7793a6" stroke-width="1.5"/><text x="175" y="146" font-size="25" fill="#263b4a" font-weight="600" text-anchor="middle">培养</text><text x="175" y="188" font-size="22" fill="#263b4a" font-weight="400" text-anchor="middle">能力待提升</text><text x="175" y="220" font-size="22" fill="#263b4a" font-weight="400" text-anchor="middle">意愿较高</text><text x="175" y="252" font-size="22" fill="#263b4a" font-weight="400" text-anchor="middle">明确目标与辅导</text><rect x="335" y="110" width="220" height="185" rx="8" fill="#edf5fb" stroke="#7793a6" stroke-width="1.5"/><text x="445" y="146" font-size="25" fill="#263b4a" font-weight="600" text-anchor="middle">授权</text><text x="445" y="188" font-size="22" fill="#263b4a" font-weight="400" text-anchor="middle">能力较高</text><text x="445" y="220" font-size="22" fill="#263b4a" font-weight="400" text-anchor="middle">意愿较高</text><text x="445" y="252" font-size="22" fill="#263b4a" font-weight="400" text-anchor="middle">给空间与挑战</text><rect x="65" y="360" width="220" height="185" rx="8" fill="#f2effc" stroke="#7793a6" stroke-width="1.5"/><text x="175" y="396" font-size="25" fill="#263b4a" font-weight="600" text-anchor="middle">诊断与支持</text><text x="175" y="438" font-size="22" fill="#263b4a" font-weight="400" text-anchor="middle">能力待提升</text><text x="175" y="470" font-size="22" fill="#263b4a" font-weight="400" text-anchor="middle">意愿较低</text><text x="175" y="502" font-size="22" fill="#263b4a" font-weight="400" text-anchor="middle">核对障碍与匹配</text><rect x="335" y="360" width="220" height="185" rx="8" fill="#fff8e8" stroke="#7793a6" stroke-width="1.5"/><text x="445" y="396" font-size="25" fill="#263b4a" font-weight="600" text-anchor="middle">恢复投入</text><text x="445" y="438" font-size="22" fill="#263b4a" font-weight="400" text-anchor="middle">能力较高</text><text x="445" y="470" font-size="22" fill="#263b4a" font-weight="400" text-anchor="middle">意愿较低</text><text x="445" y="502" font-size="22" fill="#263b4a" font-weight="400" text-anchor="middle">查明原因再调整</text><path d="M 310 575 V 86 M 42 327 H 579" fill="none" stroke="#486777" stroke-width="2"/><polygon points="310,76 304,86 316,86" fill="#486777"/><polygon points="589,327 579,321 579,333" fill="#486777"/><text x="332" y="83" font-size="22" fill="#263b4a" font-weight="400" text-anchor="start">意愿升高</text><text x="585" y="316" font-size="22" fill="#263b4a" font-weight="400" text-anchor="end">能力提高</text><text x="30" y="620" font-size="22" fill="#263b4a" font-weight="400" text-anchor="start">评估当前任务下的状态，不给人贴永久标签</text><text x="30" y="657" font-size="22" fill="#263b4a" font-weight="400" text-anchor="start">先核对事实、提供支持，再约定改进与复查</text></g></svg>
